<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>戦闘盤 見本</title>
<style>
  :root { --bg:#08070a; --panel:#1a1614; --line:#4a3f33; --text:#e8e2da; --dim:#928b82; --gold:#c7b07c; --tilt:55deg; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:'Shippori Mincho','Noto Serif JP','Yu Mincho',serif; touch-action:manipulation; user-select:none; }
  #app { position:fixed; inset:0; display:flex; }
  #stage { position:relative; flex:1; overflow:hidden; --win:27%; --pw:21%; }
  #field { position:absolute; left:0; right:var(--pw); top:0; bottom:var(--win); perspective:900px; perspective-origin:50% 25%; }
  #bgimg { position:absolute; inset:0; background-size:cover; background-position:center; filter:brightness(.55) saturate(.8); }
  #bgshade { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 30%, rgba(0,0,0,.65) 100%); pointer-events:none; }
  #board { position:absolute; left:50%; top:52%; transform-style:preserve-3d; transform-origin:50% 50%; }
  #grid { position:absolute; left:0; top:0; display:grid; transform-style:preserve-3d; }
  .cell { border:1px solid rgba(232,226,218,.28); background:rgba(10,8,8,.38); }
  .cell.alt { background:rgba(60,48,40,.34); }
  .cell.sel { background:rgba(199,176,124,.45); box-shadow:inset 0 0 12px rgba(199,176,124,.9); }
  .cell.hint { background:rgba(120,160,120,.22); }
  .bb { position:absolute; transform-origin:50% 100%; pointer-events:none; }
  .unit img { width:100%; height:100%; display:block; }
  .unit.enemy img { filter:sepia(1) saturate(2.2) hue-rotate(-35deg) brightness(.75); }
  .unit .ring { position:absolute; left:10%; right:10%; bottom:-4%; height:8%; border-radius:50%; background:rgba(0,0,0,.5); }
  .blk { position:absolute; transform-style:preserve-3d; pointer-events:none; }
  .blk .f { position:absolute; pointer-events:auto; backface-visibility:visible; }
  .wood .top   { background:linear-gradient(135deg,#a98557,#8a6a45); box-shadow:inset 0 0 0 2px #3a2a1a; }
  .wood .front { background:repeating-linear-gradient(90deg,#6e5236 0 9px,#5e4630 9px 11px); box-shadow:inset 0 0 0 2px #2c1f12; }
  .wood .side  { background:repeating-linear-gradient(0deg,#4d3926 0 9px,#3e2d1e 9px 11px); box-shadow:inset 0 0 0 2px #2c1f12; }
  .rock .top   { background:linear-gradient(135deg,#8a8a94,#6c6c76); box-shadow:inset 0 0 0 2px #22222a; }
  .rock .front { background:linear-gradient(180deg,#5c5c66,#4a4a52 60%,#3e3e46); box-shadow:inset 0 0 0 2px #1c1c22; }
  .rock .side  { background:linear-gradient(180deg,#46464e,#363640); box-shadow:inset 0 0 0 2px #1c1c22; }
  .wall .top   { background:linear-gradient(135deg,#7a6a62,#5e5049); box-shadow:inset 0 0 0 2px #1e1612; }
  .wall .front { background:repeating-linear-gradient(0deg,#6b4a3e 0 14px,#4a3228 14px 16px),#6b4a3e; box-shadow:inset 0 0 0 2px #1e1612; }
  .wall .side  { background:repeating-linear-gradient(0deg,#4f362d 0 14px,#35241d 14px 16px); box-shadow:inset 0 0 0 2px #1e1612; }
  .pillar .top   { background:linear-gradient(135deg,#b8b2a4,#9a9486); box-shadow:inset 0 0 0 2px #35322a; }
  .pillar .front { background:linear-gradient(90deg,#8c867a,#c4beb0 45%,#7a746a); box-shadow:inset 0 0 0 2px #35322a; }
  .pillar .side  { background:linear-gradient(90deg,#6a655b,#8c867a); box-shadow:inset 0 0 0 2px #35322a; }
  .barrel .top   { background:radial-gradient(circle,#8a6a45 0 35%,#5a4129 36% 100%); box-shadow:inset 0 0 0 2px #22160c; border-radius:30%; }
  .barrel .front { background:repeating-linear-gradient(90deg,#7a5836 0 7px,#5c4126 7px 9px); box-shadow:inset 0 0 0 2px #22160c, inset 0 8px 0 #3a3a40, inset 0 -8px 0 #3a3a40; }
  .barrel .side  { background:repeating-linear-gradient(0deg,#5c4126 0 7px,#46301c 7px 9px); box-shadow:inset 0 0 0 2px #22160c; }
  .altar .top   { background:linear-gradient(135deg,#3a2a46,#241a30); box-shadow:inset 0 0 0 2px #b03030, inset 0 0 14px #7a1a1a; }
  .altar .front { background:linear-gradient(180deg,#2c2236,#1a1424); box-shadow:inset 0 0 0 2px #14101c; }
  .altar .side  { background:linear-gradient(180deg,#221a2c,#150f1d); box-shadow:inset 0 0 0 2px #14101c; }
  .circle .top { background:
      radial-gradient(circle, transparent 0 20%, rgba(200,40,50,.85) 21% 23%, transparent 24% 58%, rgba(200,40,50,.85) 59% 61%, transparent 62% 94%, rgba(200,40,50,.9) 95% 97%, transparent 98%),
      repeating-conic-gradient(from 0deg, rgba(200,40,50,.55) 0 2deg, transparent 2deg 45deg),
      radial-gradient(circle, rgba(90,10,30,.5), rgba(30,0,10,.15));
    border-radius:50%; box-shadow:0 0 14px rgba(200,40,50,.6); }
  .shelf .top   { background:linear-gradient(135deg,#5a3a22,#432a18); }
  .shelf .front { background:repeating-linear-gradient(180deg, transparent 0 21%, #2a180c 21% 25%),
      repeating-linear-gradient(90deg,#7a2a22 0 5px,#2a3a5a 5px 9px,#6a5a2a 9px 13px,#1e1410 13px 15px,#3a5a3a 15px 19px,#5a2a4a 19px 22px); }
  .shelf .side  { background:linear-gradient(180deg,#4a2e1a,#33200f); }
  .solid .top   { background:linear-gradient(135deg,#1a181e,#0c0b0e); }
  .solid .front { background:repeating-linear-gradient(0deg,#1e1c22 0 18px,#0e0d10 18px 20px); }
  .solid .side  { background:linear-gradient(180deg,#141218,#09080b); }
  .blk.flat .f { pointer-events:none; }
  #board.drag .f { pointer-events:none !important; }
  .cell.bad { background:rgba(200,60,60,.4); }
  #field.edit { touch-action:none; }
  #pal { position:absolute; left:0; right:0; bottom:0; height:var(--win); z-index:8; display:none; gap:4px;
    background:rgba(14,11,10,.96); border-top:1px solid var(--gold); transition:transform .15s, opacity .15s; }
  #pal.on { display:flex; }
  #pal.hide { transform:translateY(110%); opacity:0; }
  #palEnd { flex:0 0 64px; margin:6px 0 6px 6px; background:#120f0e; color:var(--gold); border:1px solid var(--gold); font:inherit; font-size:13px; border-radius:4px; }
  #palList { flex:1; min-width:0; display:flex; gap:6px; overflow-x:auto; overflow-y:hidden; touch-action:none; padding:6px; scrollbar-width:none; }
  #palList::-webkit-scrollbar { display:none; }
  .tile { flex:0 0 auto; width:74px; display:flex; flex-direction:column; align-items:center; border:1px solid var(--line); background:#120f0e;
    border-radius:4px; padding:3px 2px; font-size:11px; color:var(--text); line-height:1.3; }
  .tile.on { border-color:var(--gold); box-shadow:0 0 8px var(--gold); }
  .tile small { color:var(--dim); font-size:10px; }
  .pv { position:relative; width:62px; height:46px; flex:0 0 auto; }
  .pv .f { position:absolute; left:50%; transform:translateX(-50%); }
  #ghost { position:fixed; z-index:40; pointer-events:none; display:none; transform:translate(-50%,-130%); opacity:.9; filter:drop-shadow(0 0 6px #c7b07c); }
  #toast { position:absolute; left:50%; top:8px; transform:translateX(-50%); z-index:12; pointer-events:none; background:rgba(4,6,30,.92);
    border:1px solid #ddd; color:#fff; padding:5px 12px; font-size:14px; border-radius:6px; display:none; white-space:pre-wrap; text-align:center; max-width:70%; }
  #info { position:absolute; left:50%; top:8px; transform:translateX(-50%); z-index:13; background:rgba(18,15,14,.96); border:1px solid var(--gold);
    padding:6px 8px; display:none; gap:6px; align-items:center; font-size:14px; flex-wrap:wrap; justify-content:center; max-width:76%; border-radius:4px; }
  #info b { color:var(--gold); font-weight:normal; }
  #info .v { min-width:2.4em; text-align:center; }
  #info button { background:#120f0e; color:var(--text); border:1px solid var(--line); font:inherit; padding:4px 8px; border-radius:3px; }
  #info button.warn { border-color:#b05a4a; color:#e08a7a; }
  .cell.f0 { background:#000 !important; border-color:#000 !important; box-shadow:none !important; }
  .cell.f1 { background:rgba(0,0,0,.74) !important; }
  .cell.f3 { background:rgba(0,0,0,.42) !important; }
  .arrow { position:absolute; display:flex; align-items:center; justify-content:center; color:#f2d98a; text-shadow:0 0 6px #000; pointer-events:none; transform:translateZ(2px); }
  #lp { position:absolute; left:50%; top:8px; transform:translateX(-50%); z-index:13; background:rgba(18,15,14,.96); border:1px solid var(--gold);
    padding:6px 8px; display:none; gap:6px; align-items:center; font-size:14px; flex-wrap:wrap; justify-content:center; max-width:78%; border-radius:4px; }
  #lp b { color:var(--gold); font-weight:normal; }
  #lp button { background:#120f0e; color:var(--text); border:1px solid var(--line); font:inherit; padding:4px 8px; border-radius:3px; }
  #lp button.on { border-color:var(--gold); color:var(--gold); }
  #board.cam { transition:margin .45s ease, transform-origin .45s ease; }
  #board.panning { transition:none !important; }
  #field.explore { touch-action:none; }
  .cell { transition:background .35s; }
  .beam, .halo { position:absolute; left:0; top:0; pointer-events:none; }
  .beam { animation:sway 3.4s ease-in-out infinite; }
  .beam.broken { animation:sway 3.4s ease-in-out infinite, flick 2.6s linear infinite; }
  @keyframes sway { 0%,100% { transform:translateZ(1.5px) rotateZ(-1.8deg); } 50% { transform:translateZ(1.5px) rotateZ(1.8deg); } }
  @keyframes flick { 0%,100%{opacity:1} 7%{opacity:.2} 9%{opacity:1} 41%{opacity:.85} 43%{opacity:.05} 46%{opacity:.9} 70%{opacity:1} 72%{opacity:.35} 74%{opacity:1} 88%{opacity:.6} 90%{opacity:1} }
  #bMode { position:absolute; left:6px; top:58px; z-index:10; display:none; background:rgba(18,15,14,.85); color:var(--gold); border:1px solid var(--gold); font:inherit; font-size:13px; padding:5px 9px; border-radius:2px; }
  #vLabel { font-size:12px; color:var(--gold); text-align:center; }
  #field { touch-action:none; }
  #stage.exp #field { right:0; bottom:0; }
  #stage.exp #params, #stage.exp #win { display:none; }
  #sil { position:absolute; inset:0; pointer-events:none; z-index:3; overflow:hidden; }
  #sil img { position:absolute; filter:brightness(0) invert(.8) sepia(.7) drop-shadow(0 0 1px #f2d98a) drop-shadow(0 0 3px #f2d98a); opacity:.38; }
  #ver { position:absolute; left:8px; top:6px; font-size:11px; color:var(--dim); z-index:3; }
  #win { position:absolute; left:2%; right:2%; bottom:2.5%; height:calc(var(--win) - 4%); z-index:5; background:rgba(4,6,30,.92);
    border:3px solid #eee; border-radius:8px; box-shadow:0 0 0 2px #000, inset 0 0 0 2px #000; padding:2% 3%; }
  #msg { font-size:clamp(14px,4.4vmin,22px); line-height:1.6; letter-spacing:.06em; color:#fff; white-space:pre-wrap; }
  #caret { position:absolute; right:14px; bottom:6px; font-size:14px; color:#fff; animation:bl 1s steps(2) infinite; }
  @keyframes bl { 50% { opacity:0; } }
  .sl { display:flex; align-items:center; gap:4px; font-size:clamp(11px,3vmin,14px); }
  .sl input { flex:1; min-width:0; }
  #menu { position:absolute; left:0; top:0; bottom:0; width:210px; padding:6px; display:none; flex-direction:column; gap:4px; overflow-y:auto;
    background:var(--panel); border-right:1px solid var(--line); z-index:9; }
  #menu.open { display:flex; }
  #bMenu { position:absolute; left:6px; top:22px; z-index:10; background:rgba(18,15,14,.85); color:var(--text); border:1px solid var(--line); font:inherit; font-size:14px; padding:6px 10px; border-radius:2px; }
  #params { position:absolute; right:0; top:0; bottom:var(--win); width:var(--pw); min-width:140px; z-index:4; padding:6px; display:flex; flex-direction:column; gap:6px; overflow:hidden;
    background:rgba(18,15,14,.82); border-left:1px solid var(--line); }
  .pc { border:1px solid var(--line); background:rgba(0,0,0,.35); padding:4px 6px; font-size:clamp(10px,2.8vmin,13px); flex:1; min-height:0; }
  .pc.ally { border-left:3px solid #7aa87a; } .pc.enemy { border-left:3px solid #b05a4a; }
  .pc.me { box-shadow:0 0 0 1px var(--gold); }
  .pn { color:var(--gold); margin-bottom:2px; white-space:nowrap; }
  .bar { display:flex; align-items:center; gap:4px; margin:1px 0; }
  .bar i { width:2.2em; font-style:normal; color:var(--dim); font-size:.9em; }
  .bar b { flex:1; height:6px; background:#2a2420; display:block; } .bar b u { display:block; height:100%; }
  .bar span { width:3.6em; text-align:right; color:var(--text); font-size:.9em; }
  #menu button { flex:1; min-height:0; background:#120f0e; color:var(--text); border:1px solid var(--line); font:inherit; font-size:clamp(11px,3.2vmin,15px); border-radius:2px; cursor:pointer; padding:2px 4px; }
  #menu button.on, #menu button:active { border-color:var(--gold); color:var(--gold); }
  #menu .row2 { display:flex; gap:4px; flex:1; min-height:0; }
  #st { position:fixed; inset:0; z-index:20; display:none; flex-direction:column; gap:6px; padding:10px; background:rgba(8,7,10,.97); font-size:14px; }
  #st .r { display:flex; gap:6px; align-items:center; }
  #st input[type=text] { flex:1; min-width:0; background:#120f0e; color:var(--text); border:1px solid var(--line); font:inherit; padding:8px; }
  #st button { background:#120f0e; color:var(--text); border:1px solid var(--line); font:inherit; padding:8px 10px; }
  #st button.warn { border-color:#b05a4a; color:#e08a7a; }
  #stList { flex:1; min-height:0; overflow-y:auto; border:1px solid var(--line); }
  #stList .it { display:flex; gap:6px; align-items:center; padding:6px 8px; border-bottom:1px solid #2a2420; }
  #stList .it span { flex:1; } #stList .it small { color:var(--dim); }
  #stTa { height:22%; background:#120f0e; color:var(--text); border:1px solid var(--line); font:12px monospace; padding:6px; }
  #io { position:fixed; inset:0; z-index:20; display:none; flex-direction:column; gap:8px; padding:12px; background:rgba(8,7,10,.97); }
  #io textarea { flex:1; background:#120f0e; color:var(--text); border:1px solid var(--line); font:12px monospace; padding:8px; }
  #io .btns { display:flex; gap:8px; }
  #io button { flex:1; padding:10px; background:#120f0e; color:var(--text); border:1px solid var(--line); font:inherit; }
  #start, #rot { position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; text-align:center;
    background:rgba(8,7,10,.96); font-size:18px; letter-spacing:.1em; padding:20px; line-height:1.9; }
  #rot { display:none; z-index:31; }
  .vv { font-size:13px; color:var(--dim); letter-spacing:.05em; }
  .unit.big img { filter:drop-shadow(0 0 10px rgba(170,0,30,.85)) sepia(1) saturate(2.4) hue-rotate(-40deg) brightness(.6); }
  /* ===== 雰囲気（v2.7） ===== */
  #moodTint, #grain, #flick { position:absolute; inset:0; pointer-events:none; display:none; }
  body.mood #moodTint, body.mood #grain, body.mood #flick { display:block; }
  #moodTint { z-index:3; background:radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 35%, rgba(0,0,0,.72) 100%), rgba(20,40,34,.22); mix-blend-mode:multiply; }
  #grain { z-index:6; width:100%; height:100%; opacity:.11; mix-blend-mode:overlay; }
  #flick { z-index:6; background:#000; opacity:0; transition:opacity .05s; }
  body.mood #bgimg { filter:brightness(.38) saturate(.45) sepia(.25); }
  body.mood .cell { border-color:rgba(0,0,0,.45);
    background:linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,0) 30%),
      repeating-linear-gradient(90deg, #3b2b1f 0 calc(33.3% - 1px), #140d08 calc(33.3% - 1px) 33.3%), #33251a; }
  body.mood .cell.alt { background:linear-gradient(0deg, rgba(0,0,0,.22), rgba(0,0,0,0) 40%),
      repeating-linear-gradient(90deg, #36281c 0 calc(33.3% - 1px), #120b07 calc(33.3% - 1px) 33.3%), #2f2218; }
  body.mood .cell.stn { background:radial-gradient(ellipse at 40% 60%, rgba(70,6,8,.85) 0 18%, rgba(50,4,6,.5) 30%, rgba(0,0,0,0) 48%),
      repeating-linear-gradient(90deg, #3b2b1f 0 calc(33.3% - 1px), #140d08 calc(33.3% - 1px) 33.3%), #33251a; }
  body.mood .cell.sel { background:rgba(199,176,124,.45); }
  body.mood .cell.hint { background:rgba(120,160,120,.3); }
  body.mood .wall .front { background:radial-gradient(ellipse at 30% 75%, rgba(20,12,6,.55) 0 20%, transparent 45%),
      radial-gradient(ellipse at 75% 30%, rgba(60,40,20,.4) 0 12%, transparent 30%),
      repeating-linear-gradient(90deg, #4c5444 0 8px, #3e4638 8px 10px, #4c5444 10px 18px, #5a5a44 18px 19px), #4c5444;
    box-shadow:inset 0 -10px 0 #2a1e14, inset 0 0 0 2px #14100c; }
  body.mood .wall .side { background:repeating-linear-gradient(90deg, #343a2e 0 8px, #2a3026 8px 10px); box-shadow:inset 0 -10px 0 #1e150e; }
  body.mood .wall .top { background:linear-gradient(135deg,#3a3028,#241c16); }
  body.mood .unit img { filter:brightness(.82) contrast(1.08) saturate(.7); }
  /* ===== メニューのタブ（v2.8） ===== */
  #menu .tabs { display:flex; gap:4px; flex:0 0 auto; }
  #menu .tabs button { flex:1; min-height:32px; }
  #menu .grp { display:none; flex-direction:column; gap:5px; }
  #menu .grp.on { display:flex; }
  #menu .grp button, #menu #bMenuClose { flex:0 0 auto; min-height:34px; }
  #menu .grp .row2 { flex:0 0 auto; }
  /* ===== 遭遇の演出（v2.8） ===== */
  .unit.haze img { filter:brightness(0) blur(4px) !important; opacity:.8; }
  .unit.haze::after { content:''; position:absolute; left:-30%; right:-30%; top:10%; bottom:-10%; border-radius:50%;
    background:radial-gradient(ellipse, rgba(0,0,0,.9) 0 30%, rgba(10,0,5,.55) 55%, rgba(0,0,0,0) 72%); animation:haze 3s ease-in-out infinite; }
  @keyframes haze { 0%,100% { transform:scale(1,1) translateY(0); opacity:.85; } 50% { transform:scale(1.15,1.05) translateY(-4%); opacity:1; } }
  #enc { position:fixed; inset:0; z-index:25; display:none; background:#000; opacity:0; transition:opacity 1.1s ease; overflow:hidden; }
  #enc.on { opacity:1; }
  #enc.shake { animation:shk .5s linear; }
  @keyframes shk { 0%,100%{transform:none} 15%{transform:translate(-9px,4px)} 30%{transform:translate(8px,-5px)} 45%{transform:translate(-6px,-3px)} 60%{transform:translate(5px,5px)} 80%{transform:translate(-3px,1px)} }
  #encView { position:absolute; left:0; right:0; top:0; bottom:30%; overflow:hidden;
    background:radial-gradient(ellipse at 50% 60%, #1a0c0c 0, #000 70%); }
  #encImg { position:absolute; left:50%; top:4%; height:92%; transform:translateX(-50%) scale(1); transform-origin:50% 50%;
    transition:transform 2.4s ease-in-out, transform-origin 2.4s ease-in-out, filter 2.4s ease, opacity 1.4s ease;
    filter:sepia(1) saturate(2.2) hue-rotate(-35deg) brightness(.15) blur(3px); opacity:0; }
  #encImg.s1 { transform:translateX(-50%) scale(3); transform-origin:50% 96%; filter:sepia(1) saturate(2.2) hue-rotate(-35deg) brightness(.4) blur(1px); opacity:1; }
  #encImg.s2 { transform:translateX(-50%) scale(2.1); transform-origin:50% 48%; filter:sepia(1) saturate(2.2) hue-rotate(-35deg) brightness(.55); opacity:1; }
  #encImg.s3, #encImg.s4 { transform:translateX(-50%) scale(1); transform-origin:50% 50%; filter:sepia(1) saturate(2.4) hue-rotate(-40deg) brightness(.7) drop-shadow(0 0 18px rgba(170,0,30,.8)); opacity:1; }
  #encView::after { content:''; position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,.9) 100%); }
  #encWin { position:absolute; left:2%; right:2%; bottom:2.5%; height:27%; background:rgba(4,6,30,.92); border:3px solid #eee; border-radius:8px;
    box-shadow:0 0 0 2px #000, inset 0 0 0 2px #000; padding:2% 3%; visibility:hidden; }
  #encMsg { font-size:clamp(14px,4.4vmin,22px); line-height:1.6; letter-spacing:.06em; color:#fff; white-space:pre-wrap; }
  #encWin span { position:absolute; right:14px; bottom:6px; font-size:14px; color:#fff; animation:bl 1s steps(2) infinite; }
  #cutin { position:absolute; inset:0; pointer-events:none; display:none; }
  #cutin.go { display:block; }
  #cutin .band { position:absolute; left:-10%; right:-10%; top:36%; height:28%; background:linear-gradient(180deg, #000, #5a0008 30%, #8a0010 50%, #5a0008 70%, #000);
    transform:skewY(-6deg) scaleX(0); transform-origin:0 50%; animation:band 1.6s ease-out forwards; box-shadow:0 0 40px rgba(200,0,20,.7); }
  #cutin .txt { position:absolute; left:0; right:0; top:50%; text-align:center; transform:translate(120%,-50%) skewY(-6deg); font-size:min(16vmin,90px); font-weight:bold;
    color:#fff; letter-spacing:.3em; text-shadow:0 0 10px #f00, 0 0 30px #a00, 3px 3px 0 #000; animation:ctx 1.6s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes band { 0%{transform:skewY(-6deg) scaleX(0)} 25%{transform:skewY(-6deg) scaleX(1)} 85%{transform:skewY(-6deg) scaleX(1); opacity:1} 100%{transform:skewY(-6deg) scaleX(1); opacity:0} }
  @keyframes ctx { 0%{transform:translate(120%,-50%) skewY(-6deg)} 30%{transform:translate(0,-50%) skewY(-6deg)} 75%{transform:translate(-4%,-50%) skewY(-6deg); opacity:1} 100%{transform:translate(-120%,-50%) skewY(-6deg); opacity:0} }
  @media (orientation:portrait) { #rot { display:flex; } }
</style>
</head>
<body>

<script>
(function(){
  var VER = 'v2.8';
  Array.prototype.forEach.call(document.querySelectorAll('.vv'), function(e){ e.textContent = '戦闘盤 見本 ' + VER; });
  var BGS = ['corridor','factory','hospital','mansion','prison','sewage','lab','parking'];
  var TILT = 55, MAXC = 40;   // マスの上限（横・縦）
  var $ = function(id){ return document.getElementById(id); };
  var stage = $('stage'), field = $('field'), board = $('board'), grid = $('grid');

  var S = { cols:8, rows:6, cells:{}, dur:{}, seen:{}, met:{}, lead:null,
    ve:{ tilt:50, yaw:0, ox:0, oy:0, scale:100 },   // 探索用の画角（S.tilt などは戦闘用） bg:0, tilt:55, yaw:0, ox:0, oy:0, scale:100,
    units:[
      {id:'a1', side:'ally', c:6, r:5, name:'探索者A', hp:12, mhp:12, mp:8, mmp:10, san:62, msan:70},
      {id:'a2', side:'ally', c:7, r:3, name:'探索者B', hp:9, mhp:11, mp:5, mmp:6, san:48, msan:55},
      {id:'e1', side:'enemy', c:1, r:0, name:'影の群れ', hp:20, mhp:20, mp:0, mmp:0},
      {id:'e2', side:'enemy', c:0, r:2, name:'歪んだ者', hp:14, mhp:16, mp:3, mmp:3} ] };
  var edit = false, selected = null, size = 60, brush = 0, dragging = false, selObj = null, explore = false, inBattle = false, panX = 0, panY = 0, noClick = false, lastCam = null;
  function camExplore(){ return explore && !inBattle; }
  function V(){ return camExplore() ? S.ve : S; }   // 今の画角（探索用 or 戦闘用）
  function leadUnit(){ var al = S.units.filter(function(u){ return u.side==='ally'; }); return al.filter(function(u){ return u.id===S.lead; })[0] || al[0] || null; }

  function key(c,r){ return r*100+c; }
  function cellAt(c,r){ return S.cells[key(c,r)] || 0; }
  function usize(u){ return Math.max(1, u.size|0 || 1); }
  function unitAt(c,r){ for (var i=0;i<S.units.length;i++){ var u=S.units[i], n=usize(u); if (c>=u.c && c<u.c+n && r>=u.r && r<u.r+n) return u; } return null; }
  function save(){ try{ localStorage.setItem('battleBoardV2', JSON.stringify(S)); }catch(e){} }
  function load(){ try{ var t = localStorage.getItem('battleBoardV2'); if (t) apply(JSON.parse(t)); }catch(e){} }
  function apply(o){
    if (!o || !o.cols || !o.rows) return;
    S.cols = Math.max(3, Math.min(MAXC, o.cols|0)); S.rows = Math.max(3, Math.min(MAXC, o.rows|0));
    S.cells = o.cells || {}; S.dur = o.dur || {}; S.bg = (o.bg|0) % BGS.length; S.tilt = o.tilt||55; S.yaw = o.yaw||0; S.ox = o.ox||0; S.oy = o.oy||0; S.scale = o.scale||100;
    if (o.ve) S.ve = o.ve; S.seen = o.seen || {}; S.met = o.met || {}; S.lead = o.lead || null; S.isSample = !!o.isSample;
    if (o.units && o.units.length) S.units = o.units;
    clampUnits();
  }
  function clampUnits(){
    S.units.forEach(function(u){
      if (u.size) u.size = Math.max(1, Math.min(u.size|0, S.cols, S.rows));
      var n = usize(u);
      u.c = Math.min(S.cols-n, Math.max(0,u.c)); u.r = Math.min(S.rows-n, Math.max(0,u.r));
      for (var y=u.r;y<u.r+n;y++) for (var x=u.c;x<u.c+n;x++){ var cv = coverAt(x,y); if (cv && OBS[cv.t].h>0) delObj(cv.c,cv.r); }
    });
  }

  function fit(){
    var v = V(); TILT = v.tilt;
    var W = field.clientWidth, H = field.clientHeight;
    if (camExplore()){ size = Math.max(Math.floor(H*0.62/4.2 * v.scale/100), 6); return; }   // 探索：盤の大きさに関係なく、手前から奥まで4〜5マスほど
    var cos = Math.cos(TILT*Math.PI/180), y = Math.abs(v.yaw)*Math.PI/180;
    var ex = S.cols*Math.cos(y) + S.rows*Math.sin(y), ey = (S.rows*Math.cos(y) + S.cols*Math.sin(y))*cos;
    size = Math.min(W*0.88/ex, H*0.66/ey, 90) * v.scale/100;
    size = Math.max(Math.floor(size), 6);
  }

  // 画面の向き・位置。探索中は先頭の味方が画面の中心に来る
  function camera(){
    var v = V(), w = S.cols*size, h = S.rows*size, m = camExplore();
    if (m!==lastCam){ board.classList.remove('cam'); lastCam = m; requestAnimationFrame(function(){ requestAnimationFrame(function(){ if (camExplore()) board.classList.add('cam'); }); }); }
    if (m){
      var L = leadUnit(), ux = (L ? L.c+.5 : S.cols/2)*size, uy = (L ? L.r+.5 : S.rows/2)*size;
      board.style.top = '60%'; board.style.transformOrigin = ux+'px '+uy+'px';
      board.style.marginLeft = (-ux + (v.ox||0) + panX)+'px'; board.style.marginTop = (-uy + (v.oy||0) + panY)+'px';
    } else {
      board.style.top = ''; board.style.transformOrigin = '';
      board.style.marginLeft = (-w/2 + (v.ox||0))+'px'; board.style.marginTop = (-h/2 + (v.oy||0))+'px';
    }
    board.style.transform = 'rotateX('+TILT+'deg) rotateZ('+v.yaw+'deg)';
    field.classList.toggle('explore', m);
    if (typeof updateSil==='function' && grid.children.length) updateSil();
    var mb = $('bMode'); mb.style.display = explore ? 'block' : 'none'; mb.textContent = inBattle ? '探索へ戻る' : '戦闘へ';
  }
  function render(){
    stage.classList.toggle('exp', camExplore());   // 探索中はパラメーターとテキスト窓を隠して盤を広く
    fit();
    var w = S.cols*size, h = S.rows*size;
    board.style.width = w+'px'; board.style.height = h+'px';
    camera();
    grid.style.width = w+'px'; grid.style.height = h+'px';
    grid.style.gridTemplateColumns = 'repeat('+S.cols+','+size+'px)';
    grid.style.gridTemplateRows = 'repeat('+S.rows+','+size+'px)';
    $('bgimg').style.backgroundImage = 'url(../assets/bg/'+BGS[S.bg]+'.webp)';
    // 以前の立体物を消す
    Array.prototype.slice.call(board.querySelectorAll('.bb, .blk')).forEach(function(n){ n.remove(); });
    grid.innerHTML = '';
    for (var r=0;r<S.rows;r++) for (var c=0;c<S.cols;c++){
      var d = document.createElement('div');
      d.className = 'cell' + ((r+c)%2 ? ' alt':'');
      d.dataset.c = c; d.dataset.r = r;
      if (selected && selected.c===c && selected.r===r) d.classList.add('sel');
      d.onclick = onCell;
      grid.appendChild(d);
      var t = cellAt(c,r);
      if (t) addObstacle(c,r,t);
      if ((c*7+r*13)%17===3) d.classList.add('stn');
    }
    S.units.forEach(addUnit);
    if (edit) markSel();
    applyFog();
    updateSil(); clearTimeout(silT); silT = setTimeout(updateSil, 500);
    renderParams();
    $('bEdit').textContent = edit ? '編集：ON' : '編集：OFF';
    $('bEdit').classList.toggle('on', edit);
  }

  // キャラの絵は盤に垂直に立てる（壁と同じ向き）。前は画面に平行で後ろへ倒れていたため、奥の壁に頭が刺さっていた。
  // 縦に立てると見かけが縮むので、そのぶん高さを伸ばして、画面上の見た目の大きさは前と同じにする。
  function place(el, c, r, wpx, hpx){
    var sn = Math.max(.5, Math.sin(TILT*Math.PI/180));
    el.style.width = wpx+'px'; el.style.height = (hpx/sn)+'px';
    el.style.left = ((c+.5)*size)+'px'; el.style.top = ((r+.62)*size)+'px';
    el.style.transform = 'translate(-50%,-100%) rotateZ('+(-V().yaw)+'deg) rotateX(-90deg)';
  }
  // 背の高い物の裏に隠れた味方は、輪郭だけ透けて見せる
  var silT = null;
  function hiddenBehind(u){
    var yw = V().yaw*Math.PI/180, sx = Math.sin(yw), sy = Math.cos(yw);   // 画面の手前方向（盤の上での向き）
    var occ = [];
    for (var k=1;k<=2;k++){
      var c = Math.round(u.c + k*sx), r = Math.round(u.r + k*sy);
      if (c<0 || r<0 || c>=S.cols || r>=S.rows) continue;
      var cv = coverAt(c, r); if (!cv) continue;
      if (OBS[cv.t].h >= (k===1 ? .95 : 1.6)) occ.push(cv);
    }
    return occ.length ? occ : null;
  }
  // 物の面が画面のどこを覆っているか（面ごとの四角をまとめたもの）
  function objRect(c, r){
    var b = board.querySelector('.blk[data-c="'+c+'"][data-r="'+r+'"]'); if (!b) return null;
    var L = 1e9, T = 1e9, R = -1e9, B = -1e9;
    Array.prototype.forEach.call(b.children, function(f){ var q = f.getBoundingClientRect(); if (!q.width) return; L = Math.min(L,q.left); T = Math.min(T,q.top); R = Math.max(R,q.right); B = Math.max(B,q.bottom); });
    return R>L ? { left:L, top:T, right:R, bottom:B } : null;
  }
  function updateSil(){
    var box = $('sil'); box.innerHTML = '';
    var fr = stage.getBoundingClientRect();
    S.units.forEach(function(u){
      if (u.side!=='ally' || !u.el || u.el.style.display==='none') return;
      var occ = hiddenBehind(u); if (!occ) return;
      var q = u.el.getBoundingClientRect(), im = document.createElement('img');
      // 実際に物に隠れている範囲だけ輪郭を出す
      var o = null;
      occ.forEach(function(cv){ var rr = objRect(cv.c, cv.r); if (!rr) return; o = o ? { left:Math.min(o.left,rr.left), top:Math.min(o.top,rr.top), right:Math.max(o.right,rr.right), bottom:Math.max(o.bottom,rr.bottom) } : rr; });
      if (!o) return;
      var ct = Math.max(0, o.top-q.top), cb = Math.max(0, q.bottom-o.bottom), cl = Math.max(0, o.left-q.left), cr = Math.max(0, q.right-o.right);
      if (ct+cb >= q.height-1 || cl+cr >= q.width-1) return;   // 重なっていない
      im.style.clipPath = 'inset('+ct+'px '+cr+'px '+cb+'px '+cl+'px)';
      im.src = u.el.firstChild.src; im.style.left = (q.left-fr.left)+'px'; im.style.top = (q.top-fr.top)+'px';
      im.style.width = q.width+'px'; im.style.height = q.height+'px';
      if (u.el.firstChild.style.transform) im.style.transform = u.el.firstChild.style.transform;
      box.appendChild(im);
    });
  }
  // 迫り上がるマス：高さ(h)はマス幅に対する比、幅(w)は占める大きさの比
  // n=名前、h=高さ（マス幅に対する比）、w=占める大きさの比、fw/fh=使うマス数、dur=耐久（-1=壊れない、null=なし）、join=並べると繋がる
  var OBS = [null,
    {n:'木箱',   cls:'wood',   h:.5,  w:1,  dur:10, join:1, edge:'#2c1f12'},   // 1
    {n:'岩',     cls:'rock',   h:1.0, w:1,  dur:40, join:1, edge:'#1c1c22'},   // 2
    {n:'壁',     cls:'wall',   h:1.7, w:1,  dur:60, join:1, edge:'#1e1612'},   // 3
    {n:'柱',     cls:'pillar', h:1.8, w:.5, dur:50},                           // 4
    {n:'樽',     cls:'barrel', h:.7,  w:.6, dur:8},                            // 5
    {n:'祭壇',   cls:'altar',  h:.6,  w:.8, dur:30},                           // 6
    {n:'長机',   cls:'wood',   h:.65, w:1, fw:2, fh:1, dur:15},                // 7
    {n:'大岩',   cls:'rock',   h:1.3, w:1, fw:2, fh:2, dur:80},                // 8
    {n:'大祭壇', cls:'altar',  h:.8,  w:1, fw:2, fh:2, dur:50},                // 9
    {n:'長い壁', cls:'wall',   h:1.7, w:1, fw:4, fh:1, dur:100},               // 10
    {n:'石の壇', cls:'rock',   h:.9,  w:1, fw:3, fh:2, dur:70},                // 11
    {n:'魔法陣', cls:'circle', h:0,   w:1, fw:2, fh:2, dur:null},              // 12
    {n:'大魔法陣',cls:'circle',h:0,   w:1, fw:4, fh:4, dur:null},              // 13
    {n:'本棚',   cls:'shelf',  h:1.9, w:1,  dur:20, join:1, edge:'#1e120a'},   // 14
    {n:'完全な壁',cls:'solid', h:2.6, w:1,  dur:-1, join:1, edge:'#000', solid:1} // 15 登れない・壊れない
  ];
  var PAL = [1,5,2,4,3,15,14,6,7,8,9,10,11,12,13];
  function canClimb(t){ var o = OBS[t]; return o.h>0 && o.h<=.7 && !o.solid; }
  function durOf(k){ var d = OBS[S.cells[k]].dur; if (d==null) return null; if (d<0) return -1; return (S.dur[k]!=null) ? S.dur[k] : d; }
  function durText(k){ var d = durOf(k); return d==null ? 'なし' : d<0 ? '∞' : String(d); }
  function fp(t){ var o = OBS[t]; return { w:o.fw||1, h:o.fh||1 }; }
  // その場所を覆っている物（なければ null）。{c,r,t}
  function coverAt(c,r){
    var ks = Object.keys(S.cells);
    for (var i=0;i<ks.length;i++){
      var k = +ks[i], t = S.cells[k], f = fp(t), ac = k%100, ar = Math.floor(k/100);
      if (c>=ac && c<ac+f.w && r>=ar && r<ar+f.h) return {c:ac, r:ar, t:t};
    }
    return null;
  }
  // 通れない（高さのある物がある）か
  function blockedAt(c,r){ var o = coverAt(c,r); return !!o && OBS[o.t].h>0; }
  function canPlace(c,r,t){
    var f = fp(t);
    if (c<0 || r<0 || c+f.w>S.cols || r+f.h>S.rows) return false;
    if (S.cells[key(c,r)]) return false;
    if (OBS[t].h===0) return true;
    for (var y=r;y<r+f.h;y++) for (var x=c;x<c+f.w;x++){
      if (unitAt(x,y)) return false;
      var o = coverAt(x,y);
      if (o && OBS[o.t].h>0) return false;
    }
    return true;
  }
  function putObj(c,r,t,d){ if (!canPlace(c,r,t)) return false; var k = key(c,r); S.cells[k] = t; if (d!=null) S.dur[k] = d; else delete S.dur[k]; return true; }
  function delObj(c,r){ var k = key(c,r); delete S.cells[k]; delete S.dur[k]; }
  function addObstacle(c,r,t){
    var o = OBS[t], f = fp(t), W = size*o.w*f.w, D = size*o.w*f.h, H = size*o.h, off = (size-size*o.w)/2;
    var b = document.createElement('div'); b.className = 'blk ' + o.cls + (H===0 ? ' flat' : ''); b.dataset.c = c; b.dataset.r = r;
    b.style.left = (c*size+off)+'px'; b.style.top = (r*size+off)+'px'; b.style.width = W+'px'; b.style.height = D+'px';
    function face(cls, css, sh){
      var e = document.createElement('div'); e.className = 'f ' + cls;
      Object.keys(css).forEach(function(k){ e.style[k] = css[k]; });
      if (sh !== undefined) e.style.boxShadow = sh;
      e.dataset.c = c; e.dataset.r = r;
      e.onclick = function(){ cellTap(c, r); };
      b.appendChild(e); return e;
    }
    var px = function(v){ return v+'px'; };
    if (H===0){ face('top', { left:'0', top:'0', width:px(W), height:px(D), transform:'translateZ(1px)' }); board.appendChild(b); return; }
    // 同じ物が隣にあれば繋げる（間の面と縁を消す）
    var J = o.join ? { l: c>0 && cellAt(c-1,r)===t, r: c+1<S.cols && cellAt(c+1,r)===t,
                       u: r>0 && cellAt(c,r-1)===t, d: r+1<S.rows && cellAt(c,r+1)===t } : null;
    function ed(l, rr, tt, bb){
      if (!J) return undefined;
      var a = [], E = o.edge;
      if (l) a.push('inset 2px 0 0 '+E); if (rr) a.push('inset -2px 0 0 '+E);
      if (tt) a.push('inset 0 2px 0 '+E); if (bb) a.push('inset 0 -2px 0 '+E);
      return a.length ? a.join(',') : 'none';

  // 通れるマスだけで道を探す（斜めも可）
  function findPath(m, c, r){
    var C = S.cols, R = S.rows, prev = {}, q = [[m.c,m.r]], k0 = key(m.c,m.r); prev[k0] = -1;
    while (q.length){
      var p = q.shift(); if (p[0]===c && p[1]===r) break;
      for (var dy=-1;dy<=1;dy++) for (var dx=-1;dx<=1;dx++){
        if (!dx && !dy) continue; var x = p[0]+dx, y = p[1]+dy, k = key(x,y);
        if (x<0||y<0||x>=C||y>=R||prev[k]!=null||blockedAt(x,y)) continue;
        var o = unitAt(x,y); if (o && o!==m) continue;
        if (dx && dy && (blockedAt(p[0]+dx,p[1]) || blockedAt(p[0],p[1]+dy))) continue;   // 角はすり抜けない
        prev[k] = key(p[0],p[1]); q.push([x,y]);
      }
    }
    if (prev[key(c,r)]==null) return null;
    var path = [], k1 = key(c,r);
    while (k1 !== k0){ path.unshift([k1%100, Math.floor(k1/100)]); k1 = prev[k1]; }
    return path;
  }
  function walkTo(m, c, r){
    var path = findPath(m, c, r);
    if (!path){ say('そこへは行けない。'); return; }
    walking = true; selected = null; S.lead = m.id; render2();
    (function step(i){
      if (i>=path.length || ENC){ walking = false; save(); if (!ENC) render2(); return; }
      var ddc = path[i][0]-m.c, ddr = path[i][1]-m.r;
      m.dir = Math.round(Math.atan2(ddr,ddc)*180/Math.PI/45)*45; m.c = path[i][0]; m.r = path[i][1];
      sfxSteps(1); panX = panY = 0; render();
      setTimeout(function(){ step(i+1); }, 300);
    })(0);
  }

  function groundCell(x, y){
    board.classList.add('drag');

  function hitAt(x, y){
    // キャラは絵のどこを触っても反応する（手前のキャラ優先）
    var us = S.units.filter(function(u){ return u.el; }).sort(function(a,b){ return (b.r+usize(b)) - (a.r+usize(a)); });
    for (var i=0;i<us.length;i++){ var q = us[i].el.getBoundingClientRect(); if (x>=q.left+q.width*.15 && x<=q.right-q.width*.15 && y>=q.top && y<=q.bottom) return { kind:'unit', u:us[i], c:us[i].c, r:us[i].r }; }
    var el = document.elementFromPoint(x, y);
    if (el && el.classList.contains('f') && el.dataset.c != null) return { kind:'obj', c:+el.dataset.c, r:+el.dataset.r };
    var g = groundCell(x, y); if (!g) return null;
    var u = unitAt(g.c, g.r); if (u) return { kind:'unit', u:u, c:g.c, r:g.r };
    var cv = coverAt(g.c, g.r); if (cv) return { kind:'obj', c:cv.c, r:cv.r };
    return { kind:'cell', c:g.c, r:g.r };
  }

  function clearHint(){ Array.prototype.forEach.call(grid.children, function(d){ d.classList.remove('hint','bad'); }); }
  function showHint(c, r, t){

    }
    if (Q.mode==='scroll'){ palList.scrollLeft = Q.sx - dx; return; }
    if (Q.mode==='single' || Q.mode==='paint'){ ghostAt(e.clientX, e.clientY); paintAt(e.clientX, e.clientY); }
  });
  function endQ(e){
    if (!Q || e.pointerId!==Q.id) return;
    clearTimeout(Q.timer); clearTimeout(Q.dw); var q = Q; Q = null;
    if (q.mode==='press'){ brush = (brush===q.t) ? 0 : q.t; buildPal(); toast(brush ? OBS[brush].n+'を選んだ。\nマスをタップすると置ける。' : '選ぶのをやめた'); return; }
    if (q.mode==='single' && e.type==='pointerup'){
      var g = groundCell(e.clientX, e.clientY);
      if (g && putObj(g.c, g.r, q.t)) vib(); else if (g) toast('ここには置けない');
    }
    if (q.mode==='paint' && q.n) toast(OBS[q.t].n+'を '+q.n+'個 置いた');
    endDrag(); ghost.style.display = 'none'; $('pal').classList.remove('hide'); clearHint(); save(); render();
  }
  palList.addEventListener('pointerup', endQ);
  palList.addEventListener('pointercancel', endQ);

  // ===== 探索モード：明かりと暗がり =====
  var LIGHTS = { lamp:'電気', torch:'懐中電灯', broken:'壊れかけ', none:'なし' };
  function lightOf(u){ return u.light || 'torch'; }
  function dirOf(u){
    if (u.dir!=null) return u.dir;
    var best = null, bd = 1e9;    // 向き未設定なら、一番近い敵のほうを向く
    S.units.forEach(function(o){ if (o.side!=='enemy') return; var d = (o.c-u.c)*(o.c-u.c)+(o.r-u.r)*(o.r-u.r); if (d<bd){ bd = d; best = o; } });
    return best ? Math.round(Math.atan2(best.r-u.r, best.c-u.c)*180/Math.PI/45)*45 : 0;
  }
  // 各マスの見え方：0=見ていない 1=見たが今は暗い 2=明るい 3=うす暗い（ぼんやり見える）
  function computeVis(){
    var C = S.cols, R = S.rows, vis = new Array(C*R), tall = new Array(C*R), i;
    for (i=0;i<C*R;i++){ vis[i] = 0; tall[i] = false; }
    Object.keys(S.cells).forEach(function(k){ var t = S.cells[k], o = OBS[t]; if (o.h < 1) return; var f = fp(t), ac = k%100, ar = Math.floor(k/100);
      for (var y=ar;y<ar+f.h;y++) for (var x=ac;x<ac+f.w;x++) if (x<C && y<R) tall[y*C+x] = true; });
    function los(c0,r0,c1,r1){          // 間に背の高い物があれば見えない
      var dx = Math.abs(c1-c0), dy = Math.abs(r1-r0), sx = c0<c1?1:-1, sy = r0<r1?1:-1, err = dx-dy, x = c0, y = r0;
      while (!(x===c1 && y===r1)){
        if (!(x===c0 && y===r0) && tall[y*C+x]) return false;
        var e2 = 2*err; if (e2 > -dy){ err -= dy; x += sx; } if (e2 < dx){ err += dx; y += sy; }
      }
      return true;
    }
    function mark(idx, v){ var cur = (vis[idx]===2) ? 2 : (vis[idx]===3 ? 3 : 0); if (v===2 || (v===3 && cur===0)) vis[idx] = v; }
    S.units.forEach(function(u){
      if (u.side!=='ally') return;
      var uc = u.c, ur = u.r, L = lightOf(u), a0 = dirOf(u)*Math.PI/180;
      for (var r=0;r<R;r++) for (var c=0;c<C;c++){
        var d = Math.max(Math.abs(c-uc), Math.abs(r-ur));
        if (d===0){ mark(r*C+c, 2); continue; }
        if (d<=1) mark(r*C+c, 3);             // 自分のマス＋約0.5マス
        if (!los(uc,ur,c,r)) continue;
        if (L==='lamp'){ mark(r*C+c, 2); }
        else if (L==='torch' || L==='broken'){
          var ang = Math.atan2(r-ur, c-uc), diff = Math.abs(Math.atan2(Math.sin(ang-a0), Math.cos(ang-a0)));
          var dist = Math.sqrt((c-uc)*(c-uc)+(r-ur)*(r-ur)), far = L==='torch' ? 5.2 : 3.6, near = L==='torch' ? 3.2 : 2.0;
          if (diff <= Math.PI/5+0.01 && dist <= far) mark(r*C+c, dist<=near ? 2 : 3);
        }
      }
    });
    for (i=0;i<C*R;i++) if (vis[i]>=2) S.seen[i] = 1;   // key(c,r) とは別に、行×列番号で覚える
    for (i=0;i<C*R;i++) if (vis[i]===0 && S.seen[i]) vis[i] = 1;
    return vis;
  }
  function applyFog(){
    updateLP();
    Array.prototype.forEach.call(board.querySelectorAll('.arrow, .beam, .halo'), function(n){ n.remove(); });
    if (!explore) return;
    var vis = computeVis(), C = S.cols;
    Array.prototype.forEach.call(grid.children, function(d){
      var v = vis[(+d.dataset.r)*C + (+d.dataset.c)];
      d.classList.remove('f0','f1','f3'); if (v===0) d.classList.add('f0'); else if (v===1) d.classList.add('f1'); else if (v===3) d.classList.add('f3');
    });
    Array.prototype.forEach.call(board.querySelectorAll('.blk'), function(b){
      var c = +b.dataset.c, r = +b.dataset.r, t = S.cells[key(c,r)]; if (!t) return;
      var f = fp(t), m = 0;
      for (var y=r;y<r+f.h;y++) for (var x=c;x<c+f.w;x++){ var v = vis[y*C+x]; if (v===2) m = 2; else if (v===3 && m!==2) m = 3; else if (v===1 && m===0) m = 1; }
      b.style.display = m===0 ? 'none' : '';
      var fl = m===2 ? '' : m===3 ? 'brightness(.7)' : 'brightness(.32)';
      Array.prototype.forEach.call(b.children, function(e){ e.style.filter = fl; });
    });
    S.units.forEach(function(u){
      if (!u.el) return;
      if (u.side==='ally'){ u.el.style.display = ''; return; }
      var n = usize(u), show = false;
      for (var y=u.r;y<u.r+n;y++) for (var x=u.c;x<u.c+n;x++) if (vis[y*C+x]===2 || vis[y*C+x]===3) show = true;
      u.el.style.display = show ? '' : 'none';
    });
    // 敵が見えたら戦闘へ（一度出会った敵では、もう切り替えない）
    if (!inBattle){
      var newly = [];
      S.units.forEach(function(u){
        if (u.side!=='enemy' || S.met[u.id] || !u.el || u.el.style.display==='none') return;
        // 照らされていて近い（3マス以内）なら遭遇。それ以外は黒いモヤで、姿が分からない
        var n = usize(u), lit = false, near = false;
        for (var y=u.r;y<u.r+n;y++) for (var x=u.c;x<u.c+n;x++) if (vis[y*C+x]===2) lit = true;
        S.units.forEach(function(a){ if (a.side!=='ally') return; var dx = Math.max(0, u.c-a.c, a.c-(u.c+n-1)), dy = Math.max(0, u.r-a.r, a.r-(u.r+n-1)); if (Math.max(dx,dy)<=3) near = true; });
        if (lit && near && !ENC){ S.met[u.id] = 1; newly.push(u); } else u.el.classList.add('haze');
      });
      if (newly.length){ save(); setTimeout(function(){ startEncounter(newly); }, 0); }
    }
    // 懐中電灯の光（暖かい色、中心ほど明るく、ゆらゆら揺れる。壊れかけはちらつく）
    var w = S.cols*size, h = S.rows*size;
    S.units.forEach(function(u){
      if (u.side!=='ally') return;
      var L = lightOf(u), X = (u.c+.5)*size, Y = (u.r+.5)*size;
      var ha = document.createElement('div'); ha.className = 'halo';
      ha.style.width = w+'px'; ha.style.height = h+'px'; ha.style.transform = 'translateZ(1.4px)';
      ha.style.background = 'radial-gradient(circle at '+X+'px '+Y+'px, rgba(255,222,160,'+(L==='lamp'?0:.16)+') 0, rgba(255,210,140,0) '+(size*1.1)+'px)';
      board.appendChild(ha);
      if (L!=='torch' && L!=='broken') return;
      var R = (L==='torch' ? 5.4 : 3.8)*size, A = dirOf(u)+90-40;
      var b = document.createElement('div'); b.className = 'beam' + (L==='broken' ? ' broken' : '');
      b.style.width = w+'px'; b.style.height = h+'px'; b.style.transformOrigin = X+'px '+Y+'px';
      b.style.background = 'radial-gradient(circle at '+X+'px '+Y+'px, rgba(255,232,170,.42) 0, rgba(255,214,140,.24) '+(R*.35)+'px, rgba(255,196,110,.10) '+(R*.7)+'px, rgba(255,190,100,0) '+R+'px)';
      var mk = 'conic-gradient(from '+A+'deg at '+X+'px '+Y+'px, transparent 0deg, #000 12deg, #000 68deg, transparent 80deg, transparent 360deg)';
      b.style.webkitMaskImage = mk; b.style.maskImage = mk;
      board.appendChild(b);
    });
    // 向きの矢印（味方）
    S.units.forEach(function(u){
      if (u.side!=='ally') return;
      var a = document.createElement('div'); a.className = 'arrow'; a.textContent = '➤';
      a.style.left = (u.c*size)+'px'; a.style.top = (u.r*size)+'px'; a.style.width = size+'px'; a.style.height = size+'px';
      a.style.fontSize = (size*.45)+'px'; a.style.transform = 'translateZ(2px) rotateZ('+dirOf(u)+'deg)'; a.style.opacity = '.85';
      board.appendChild(a);
    });
  }
  function updateLP(){
    var box = $('lp');
    if (!explore || !selected || selected.side!=='ally'){ box.style.display = 'none'; return; }
    box.innerHTML = '';
    function el(tag, txt, cls, fn){ var e = document.createElement(tag); e.textContent = txt; if (cls) e.className = cls; if (fn) e.onclick = fn; box.appendChild(e); return e; }
    el('b', selected.name);
    Object.keys(LIGHTS).forEach(function(k){ el('button', LIGHTS[k], lightOf(selected)===k ? 'on' : '', function(){ selected.light = k; save(); render(); }); });
    el('button', '◀ 向き', '', function(){ selected.dir = (dirOf(selected)+315)%360; save(); render(); });
    el('button', '向き ▶', '', function(){ selected.dir = (dirOf(selected)+45)%360; save(); render(); });
    box.style.display = 'flex';
  }
  $('bExp').onclick = function(){
    explore = !explore; inBattle = false; panX = panY = 0; if (explore && edit) setEdit(false);
    $('bExp').textContent = '探索モード：' + (explore ? 'ON' : 'OFF'); $('bExp').classList.toggle('on', explore);
    $('menu').classList.remove('open'); selected = null; render(); syncSliders();
    say(explore ? '探索モード。\n見えている所だけが明るい。\n味方をタップして、灯りと向きを変えよう。' : '探索モードを終えた。');
  };
  $('bSeen').onclick = function(){ S.seen = {}; S.met = {}; save(); render(); toast('見た場所を忘れた。'); };
  $('bMode').onclick = function(){
    inBattle = !inBattle; panX = panY = 0; selected = null; render(); syncSliders();
    say(inBattle ? '戦闘の画面に切り替えた。' : '探索に戻った。\n画面をスワイプすると、周りを見回せる。');
  };
  // 探索中：スワイプで画面をずらす（ある程度まで）
  var PN = null;
  field.addEventListener('pointerdown', function(e){ if (edit || !camExplore() || PN || G) return; PN = { id:e.pointerId, x:e.clientX, y:e.clientY, px:panX, py:panY, moved:false }; });
  field.addEventListener('pointermove', function(e){
    if (!PN || e.pointerId!==PN.id) return;
    var dx = e.clientX-PN.x, dy = e.clientY-PN.y;
    if (!PN.moved && Math.abs(dx)+Math.abs(dy) > 12){ PN.moved = true; board.classList.add('panning'); try { field.setPointerCapture(e.pointerId); } catch(_){} }
    if (!PN.moved) return;
    var W = field.clientWidth*.42, H = field.clientHeight*.42;
    panX = Math.max(-W, Math.min(W, PN.px+dx)); panY = Math.max(-H, Math.min(H, PN.py+dy)); camera();
  });
  function endPN(e){ if (!PN || e.pointerId!==PN.id) return; if (PN.moved){ noClick = true; setTimeout(function(){ noClick = false; }, 80); board.classList.remove('panning'); } PN = null; }
  field.addEventListener('pointerup', endPN); field.addEventListener('pointercancel', endPN);

  // 2本指：ピンチで大きさ、ひねると回転（今の画面の画角に保存）
  var PTS = {}, G = null, gRaf = 0;
  function gInfo(){ var k = Object.keys(PTS); if (k.length<2) return null; var a = PTS[k[0]], b = PTS[k[1]];
    return { d:Math.hypot(b.x-a.x, b.y-a.y), a:Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI }; }
  field.addEventListener('pointerdown', function(e){
    if (edit) return;
    PTS[e.pointerId] = { x:e.clientX, y:e.clientY };
    if (Object.keys(PTS).length===2){
      var g = gInfo(); G = { d0:g.d, a0:g.a, s0:V().scale, y0:V().yaw };
      if (PN){ PN = null; board.classList.remove('panning'); }
      board.classList.add('panning');
    }
  }, true);
  field.addEventListener('pointermove', function(e){
    if (!PTS[e.pointerId]) return;
    PTS[e.pointerId] = { x:e.clientX, y:e.clientY };
    if (!G) return;
    var g = gInfo(); if (!g || g.d0===0) return;
    var v = V(), da = g.a - G.a0; while (da>180) da -= 360; while (da<-180) da += 360;
    v.scale = Math.max(40, Math.min(300, Math.round(G.s0 * g.d / G.d0)));
    var y = G.y0 + da; while (y>180) y -= 360; while (y<-180) y += 360; v.yaw = Math.round(y);
    if (!gRaf) gRaf = requestAnimationFrame(function(){ gRaf = 0; render(); });
  }, true);
  function gEnd(e){
    if (!PTS[e.pointerId]) return;
    delete PTS[e.pointerId];
    if (G && Object.keys(PTS).length<2){ G = null; noClick = true; setTimeout(function(){ noClick = false; }, 120); board.classList.remove('panning'); save(); syncSliders(); render(); }
  }
  field.addEventListener('pointerup', gEnd, true); field.addEventListener('pointercancel', gEnd, true);

  // キャラは絵のどこを触っても選べる（壁や本棚の裏にいても）
  field.addEventListener('click', function(e){
    if (edit || noClick) return;
    if (selected && e.target.classList && e.target.classList.contains('cell') && !unitAt(+e.target.dataset.c, +e.target.dataset.r)) return;   // 選択中の空きマスへの移動はそのまま
    var x = e.clientX, y = e.clientY;
    var us = S.units.filter(function(u){ return u.el && u.el.style.display!=='none'; })
      .sort(function(a,b){ return (a.side==='ally'?0:1)-(b.side==='ally'?0:1) || (b.r+usize(b))-(a.r+usize(a)); });
    for (var i=0;i<us.length;i++){
      var q = us[i].el.getBoundingClientRect();
      if (x>=q.left+q.width*.18 && x<=q.right-q.width*.18 && y>=q.top+q.height*.05 && y<=q.bottom){
        e.stopPropagation(); e.preventDefault(); cellTap(us[i].c, us[i].r); return;
      }
    }
  }, true);

  load(); syncSliders(); render();
})();
</script>
