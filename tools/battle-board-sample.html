<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>戦闘盤 見本 v1.0</title>
<style>
  :root { --bg:#08070a; --panel:#1a1614; --line:#4a3f33; --text:#e8e2da; --dim:#928b82; --gold:#c7b07c; --tilt:55deg; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:'Shippori Mincho','Noto Serif JP','Yu Mincho',serif; touch-action:manipulation; user-select:none; }
  #app { position:fixed; inset:0; display:flex; }
  #stage { position:relative; flex:1; overflow:hidden; --win:27%; }
  #field { position:absolute; left:0; right:0; top:0; bottom:var(--win); perspective:900px; perspective-origin:50% 25%; }
  #bgimg { position:absolute; inset:0; background-size:cover; background-position:center; filter:brightness(.55) saturate(.8); }
  #bgshade { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 30%, rgba(0,0,0,.65) 100%); pointer-events:none; }
  #board { position:absolute; left:50%; top:52%; transform-style:preserve-3d; transform-origin:50% 50%; }
  #grid { position:absolute; left:0; top:0; display:grid; transform-style:preserve-3d; }
  .cell { border:1px solid rgba(232,226,218,.28); background:rgba(10,8,8,.38); }
  .cell.alt { background:rgba(60,48,40,.34); }
  .cell.sel { background:rgba(199,176,124,.45); box-shadow:inset 0 0 12px rgba(199,176,124,.9); }
  .cell.hint { background:rgba(120,160,120,.22); }
  .bb { position:absolute; transform-origin:50% 100%; pointer-events:none; }
  .unit img { width:100%; height:100%; display:block; }
  .unit.enemy img { filter:sepia(1) saturate(2.2) hue-rotate(-35deg) brightness(.75); }
  .unit .ring { position:absolute; left:10%; right:10%; bottom:-4%; height:8%; border-radius:50%; background:rgba(0,0,0,.5); }
  .obs { border:2px solid #0006; }
  .obs.box { background:linear-gradient(180deg,#8a6a45 0 18%,#5e4630 18% 100%); box-shadow:inset 0 0 0 2px #3a2a1a; }
  .obs.pillar { background:linear-gradient(90deg,#4a4a52,#6a6a74 50%,#3c3c44); box-shadow:inset 0 0 0 2px #22222a; }
  #ver { position:absolute; left:8px; top:6px; font-size:11px; color:var(--dim); z-index:3; }
  #win { position:absolute; left:2%; right:2%; bottom:2.5%; height:calc(var(--win) - 4%); z-index:5; background:rgba(4,6,30,.92);
    border:3px solid #eee; border-radius:8px; box-shadow:0 0 0 2px #000, inset 0 0 0 2px #000; padding:2% 3%; }
  #msg { font-size:clamp(14px,4.4vmin,22px); line-height:1.6; letter-spacing:.06em; color:#fff; white-space:pre-wrap; }
  #caret { position:absolute; right:14px; bottom:6px; font-size:14px; color:#fff; animation:bl 1s steps(2) infinite; }
  @keyframes bl { 50% { opacity:0; } }
  .sl { display:flex; align-items:center; gap:4px; font-size:clamp(11px,3vmin,14px); }
  .sl input { flex:1; min-width:0; }
  #menu { width:21%; min-width:150px; max-width:220px; padding:6px; display:flex; flex-direction:column; gap:4px; overflow-y:auto;
    background:var(--panel); border-left:1px solid var(--line); z-index:4; }
  #menu button { flex:1; min-height:0; background:#120f0e; color:var(--text); border:1px solid var(--line); font:inherit; font-size:clamp(11px,3.2vmin,15px); border-radius:2px; cursor:pointer; padding:2px 4px; }
  #menu button.on, #menu button:active { border-color:var(--gold); color:var(--gold); }
  #menu .row2 { display:flex; gap:4px; flex:1; min-height:0; }
  #io { position:fixed; inset:0; z-index:20; display:none; flex-direction:column; gap:8px; padding:12px; background:rgba(8,7,10,.97); }
  #io textarea { flex:1; background:#120f0e; color:var(--text); border:1px solid var(--line); font:12px monospace; padding:8px; }
  #io .btns { display:flex; gap:8px; }
  #io button { flex:1; padding:10px; background:#120f0e; color:var(--text); border:1px solid var(--line); font:inherit; }
  #start, #rot { position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; text-align:center;
    background:rgba(8,7,10,.96); font-size:18px; letter-spacing:.1em; padding:20px; line-height:1.9; }
  #rot { display:none; z-index:31; }
  @media (orientation:portrait) { #rot { display:flex; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="bgimg"></div><div id="bgshade"></div>
    <div id="ver">戦闘盤 見本 v1.0</div>
    <div id="field"><div id="board"><div id="grid"></div></div></div>
    <div id="win"><div id="msg"></div><span id="caret">▼</span></div>
  </div>
  <div id="menu">
    <button id="bEdit">編集：OFF</button>
    <div class="row2"><button id="bCp">横＋</button><button id="bCm">横－</button></div>
    <div class="row2"><button id="bRp">縦＋</button><button id="bRm">縦－</button></div>
    <div class="sl">角度<input type="range" id="sTilt" min="20" max="80" step="1"></div>
    <div class="sl">大きさ<input type="range" id="sScale" min="50" max="140" step="1"></div>
    <button id="bBg">背景を変える</button>
    <button id="bClear">障害物を全消去</button>
    <button id="bIo">書き出し／読込</button>
  </div>
</div>

<div id="io">
  <div>下の文字をコピーすると、この盤を保存できます。貼り付けて「読み込む」で再現します。</div>
  <textarea id="ta" spellcheck="false"></textarea>
  <div class="btns"><button id="ioLoad">読み込む</button><button id="ioClose">閉じる</button></div>
</div>

<div id="start">タップして開始<br>（全画面・横向きになります）</div>
<div id="rot">スマホを横向きにしてください</div>

<script>
(function(){
  var BGS = ['corridor','factory','hospital','mansion','prison','sewage','lab','parking'];
  var TILT = 55;
  var $ = function(id){ return document.getElementById(id); };
  var stage = $('stage'), field = $('field'), board = $('board'), grid = $('grid');

  var S = { cols:8, rows:6, cells:[], bg:0, tilt:55, scale:100,
    units:[ {id:'a1', side:'ally', c:2, r:5}, {id:'a2', side:'ally', c:5, r:5}, {id:'e1', side:'enemy', c:3, r:0}, {id:'e2', side:'enemy', c:6, r:0} ] };
  var edit = false, selected = null, size = 60;

  function key(c,r){ return r*100+c; }
  function cellAt(c,r){ return S.cells[key(c,r)] || 0; }
  function unitAt(c,r){ for (var i=0;i<S.units.length;i++){ var u=S.units[i]; if (u.c===c && u.r===r) return u; } return null; }
  function save(){ try{ localStorage.setItem('battleBoardV1', JSON.stringify(S)); }catch(e){} }
  function load(){ try{ var t = localStorage.getItem('battleBoardV1'); if (t) apply(JSON.parse(t)); }catch(e){} }
  function apply(o){
    if (!o || !o.cols || !o.rows) return;
    S.cols = Math.max(3, Math.min(14, o.cols|0)); S.rows = Math.max(3, Math.min(12, o.rows|0));
    S.cells = o.cells || {}; S.bg = (o.bg|0) % BGS.length; S.tilt = o.tilt||55; S.scale = o.scale||100;
    if (o.units && o.units.length) S.units = o.units;
    clampUnits();
  }
  function clampUnits(){
    S.units.forEach(function(u){
      u.c = Math.min(S.cols-1, Math.max(0,u.c)); u.r = Math.min(S.rows-1, Math.max(0,u.r));
      delete S.cells[key(u.c,u.r)];
    });
  }

  function fit(){
    TILT = S.tilt;
    var W = field.clientWidth, H = field.clientHeight;
    var cos = Math.cos(TILT*Math.PI/180);
    size = Math.min(W*0.88/S.cols, H*0.66/(S.rows*cos), 90) * S.scale/100;
    size = Math.max(Math.floor(size), 18);
  }

  function render(){
    fit();
    var w = S.cols*size, h = S.rows*size;
    board.style.width = w+'px'; board.style.height = h+'px';
    board.style.marginLeft = (-w/2)+'px'; board.style.marginTop = (-h/2)+'px';
    board.style.transform = 'rotateX('+TILT+'deg)';
    grid.style.width = w+'px'; grid.style.height = h+'px';
    grid.style.gridTemplateColumns = 'repeat('+S.cols+','+size+'px)';
    grid.style.gridTemplateRows = 'repeat('+S.rows+','+size+'px)';
    $('bgimg').style.backgroundImage = 'url(../assets/bg/'+BGS[S.bg]+'.webp)';
    // 以前の立体物を消す
    Array.prototype.slice.call(board.querySelectorAll('.bb')).forEach(function(n){ n.remove(); });
    grid.innerHTML = '';
    for (var r=0;r<S.rows;r++) for (var c=0;c<S.cols;c++){
      var d = document.createElement('div');
      d.className = 'cell' + ((r+c)%2 ? ' alt':'');
      d.dataset.c = c; d.dataset.r = r;
      if (selected && selected.c===c && selected.r===r) d.classList.add('sel');
      d.onclick = onCell;
      grid.appendChild(d);
      var t = cellAt(c,r);
      if (t) addObstacle(c,r,t);
    }
    S.units.forEach(addUnit);
    $('bEdit').textContent = edit ? '編集：ON' : '編集：OFF';
    $('bEdit').classList.toggle('on', edit);
  }

  function place(el, c, r, wpx, hpx){
    el.style.width = wpx+'px'; el.style.height = hpx+'px';
    el.style.left = ((c+.5)*size)+'px'; el.style.top = ((r+.62)*size)+'px';
    el.style.transform = 'translate(-50%,-100%) rotateX(-'+TILT+'deg)';
  }
  function addObstacle(c,r,t){
    var o = document.createElement('div'); o.className = 'bb obs ' + (t===1?'box':'pillar');
    place(o, c, r, size*(t===1?0.78:0.8), size*(t===1?0.75:1.7));
    board.appendChild(o);
  }
  function addUnit(u){
    var el = document.createElement('div'); el.className = 'bb unit ' + u.side;
    var h = size*1.5;
    place(el, u.c, u.r, h*469/811, h);
    el.style.transition = 'left .4s ease, top .4s ease';
    var img = document.createElement('img');
    img.src = '../assets/chara/sample_' + (u.side==='ally' ? 'back' : 'front') + '.webp';
    el.appendChild(img);
    board.appendChild(el); u.el = el;
  }

  function onCell(e){
    var c = +this.dataset.c, r = +this.dataset.r;
    var u = unitAt(c,r);
    if (edit){
      if (u) return;
      var t = (cellAt(c,r)+1)%3;
      if (t) S.cells[key(c,r)] = t; else delete S.cells[key(c,r)];
      save(); render(); return;
    }
    if (u && u.side==='ally'){ selected = (selected===u) ? null : u; render2(); say(selected ? '味方を選んだ。\nどこへ動く？' : '選びなおした。'); return; }
    if (selected && !u && !cellAt(c,r)){
      var m = selected; m.c = c; m.r = r; selected = null; save(); render2(); say('味方は 素早く移動した。');
      if (m.el){ m.el.style.left = ((c+.5)*size)+'px'; m.el.style.top = ((r+.62)*size)+'px'; setTimeout(render, 450); } else render();
      return;
    }
    selected = null; render2();
  }
  // 選択の見た目だけ更新（作り直さない）
  function render2(){
    Array.prototype.forEach.call(grid.children, function(d){
      d.classList.toggle('sel', !!selected && selected.c===+d.dataset.c && selected.r===+d.dataset.r);
    });
  }

  $('bEdit').onclick = function(){ edit = !edit; selected = null; render();
    say(edit ? '編集モード。\nマスをタップすると、箱→柱→なし の順で置ける。' : '編集を終えた。\n味方をタップして動かそう。'); };
  var tm = null;
  function say(t){
    clearInterval(tm); var i = 0, m = $('msg'); m.textContent = '';
    tm = setInterval(function(){ i++; m.textContent = t.slice(0,i); if (i>=t.length) clearInterval(tm); }, 28);
  }
  $('sTilt').value = S.tilt; $('sScale').value = S.scale;
  $('sTilt').oninput = function(){ S.tilt = +this.value; save(); render(); };
  $('sScale').oninput = function(){ S.scale = +this.value; save(); render(); };
  function resize(dc, dr){
    S.cols = Math.max(3, Math.min(14, S.cols+dc)); S.rows = Math.max(3, Math.min(12, S.rows+dr));
    // 範囲外の障害物を消す
    Object.keys(S.cells).forEach(function(k){ var r=Math.floor(k/100), c=k%100; if (c>=S.cols||r>=S.rows) delete S.cells[k]; });
    clampUnits(); save(); render();
  }
  $('bCp').onclick = function(){ resize(1,0); };
  $('bCm').onclick = function(){ resize(-1,0); };
  $('bRp').onclick = function(){ resize(0,1); };
  $('bRm').onclick = function(){ resize(0,-1); };
  $('bBg').onclick = function(){ S.bg = (S.bg+1)%BGS.length; save(); render(); };
  $('bClear').onclick = function(){ S.cells = {}; save(); render(); };

  $('bIo').onclick = function(){
    var o = { cols:S.cols, rows:S.rows, bg:S.bg, tilt:S.tilt, scale:S.scale, cells:S.cells, units:S.units.map(function(u){ return {id:u.id, side:u.side, c:u.c, r:u.r}; }) };
    $('ta').value = JSON.stringify(o);
    $('io').style.display = 'flex';
  };
  $('ioClose').onclick = function(){ $('io').style.display = 'none'; };
  $('ioLoad').onclick = function(){
    try { apply(JSON.parse($('ta').value)); save(); $('io').style.display='none'; render(); } catch(e){ $('ta').value = '読み込めませんでした。コピーした文字を、そのまま貼り付けてください。'; }
  };

  $('start').onclick = function(){
    this.style.display = 'none';
    var el = document.documentElement;
    try { (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch(e){}
    try { screen.orientation.lock('landscape').catch(function(){}); } catch(e){}
    setTimeout(render, 300); say('戦闘開始！\n味方をタップして、動かしたいマスをタップしよう。');
  };
  window.addEventListener('resize', function(){ setTimeout(render, 100); });

  load(); $('sTilt').value = S.tilt; $('sScale').value = S.scale; render();
})();
</script>
</body>
</html>
