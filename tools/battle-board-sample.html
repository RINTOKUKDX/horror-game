<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>戦闘盤 見本 v1.0</title>
<style>
  :root { --bg:#08070a; --panel:#1a1614; --line:#4a3f33; --text:#e8e2da; --dim:#928b82; --gold:#c7b07c; --tilt:55deg; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:'Shippori Mincho','Noto Serif JP','Yu Mincho',serif; touch-action:manipulation; user-select:none; }
  #app { position:fixed; inset:0; display:flex; }
  #stage { position:relative; flex:1; overflow:hidden; --win:27%; --pw:21%; }
  #field { position:absolute; left:0; right:var(--pw); top:0; bottom:var(--win); perspective:900px; perspective-origin:50% 25%; }
  #bgimg { position:absolute; inset:0; background-size:cover; background-position:center; filter:brightness(.55) saturate(.8); }
  #bgshade { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 30%, rgba(0,0,0,.65) 100%); pointer-events:none; }
  #board { position:absolute; left:50%; top:52%; transform-style:preserve-3d; transform-origin:50% 50%; }
  #grid { position:absolute; left:0; top:0; display:grid; transform-style:preserve-3d; }
  .cell { border:1px solid rgba(232,226,218,.28); background:rgba(10,8,8,.38); }
  .cell.alt { background:rgba(60,48,40,.34); }
  .cell.sel { background:rgba(199,176,124,.45); box-shadow:inset 0 0 12px rgba(199,176,124,.9); }
  .cell.hint { background:rgba(120,160,120,.22); }
  .bb { position:absolute; transform-origin:50% 100%; pointer-events:none; }
  .unit img { width:100%; height:100%; display:block; }
  .unit.enemy img { filter:sepia(1) saturate(2.2) hue-rotate(-35deg) brightness(.75); }
  .unit .ring { position:absolute; left:10%; right:10%; bottom:-4%; height:8%; border-radius:50%; background:rgba(0,0,0,.5); }
  .blk { position:absolute; transform-style:preserve-3d; pointer-events:none; }
  .blk .f { position:absolute; pointer-events:auto; backface-visibility:visible; }
  .blk.wood .top   { background:linear-gradient(135deg,#a98557,#8a6a45); box-shadow:inset 0 0 0 2px #3a2a1a; }
  .blk.wood .front { background:repeating-linear-gradient(90deg,#6e5236 0 9px,#5e4630 9px 11px); box-shadow:inset 0 0 0 2px #2c1f12; }
  .blk.wood .side  { background:repeating-linear-gradient(0deg,#4d3926 0 9px,#3e2d1e 9px 11px); box-shadow:inset 0 0 0 2px #2c1f12; }
  .blk.rock .top   { background:linear-gradient(135deg,#8a8a94,#6c6c76); box-shadow:inset 0 0 0 2px #22222a; }
  .blk.rock .front { background:linear-gradient(180deg,#5c5c66,#4a4a52 60%,#3e3e46); box-shadow:inset 0 0 0 2px #1c1c22; }
  .blk.rock .side  { background:linear-gradient(180deg,#46464e,#363640); box-shadow:inset 0 0 0 2px #1c1c22; }
  #ver { position:absolute; left:8px; top:6px; font-size:11px; color:var(--dim); z-index:3; }
  #win { position:absolute; left:2%; right:2%; bottom:2.5%; height:calc(var(--win) - 4%); z-index:5; background:rgba(4,6,30,.92);
    border:3px solid #eee; border-radius:8px; box-shadow:0 0 0 2px #000, inset 0 0 0 2px #000; padding:2% 3%; }
  #msg { font-size:clamp(14px,4.4vmin,22px); line-height:1.6; letter-spacing:.06em; color:#fff; white-space:pre-wrap; }
  #caret { position:absolute; right:14px; bottom:6px; font-size:14px; color:#fff; animation:bl 1s steps(2) infinite; }
  @keyframes bl { 50% { opacity:0; } }
  .sl { display:flex; align-items:center; gap:4px; font-size:clamp(11px,3vmin,14px); }
  .sl input { flex:1; min-width:0; }
  #menu { position:absolute; left:0; top:0; bottom:0; width:210px; padding:6px; display:none; flex-direction:column; gap:4px; overflow-y:auto;
    background:var(--panel); border-right:1px solid var(--line); z-index:9; }
  #menu.open { display:flex; }
  #bMenu { position:absolute; left:6px; top:22px; z-index:10; background:rgba(18,15,14,.85); color:var(--text); border:1px solid var(--line); font:inherit; font-size:14px; padding:6px 10px; border-radius:2px; }
  #params { position:absolute; right:0; top:0; bottom:var(--win); width:var(--pw); min-width:140px; z-index:4; padding:6px; display:flex; flex-direction:column; gap:6px; overflow:hidden;
    background:rgba(18,15,14,.82); border-left:1px solid var(--line); }
  .pc { border:1px solid var(--line); background:rgba(0,0,0,.35); padding:4px 6px; font-size:clamp(10px,2.8vmin,13px); flex:1; min-height:0; }
  .pc.ally { border-left:3px solid #7aa87a; } .pc.enemy { border-left:3px solid #b05a4a; }
  .pc.me { box-shadow:0 0 0 1px var(--gold); }
  .pn { color:var(--gold); margin-bottom:2px; white-space:nowrap; }
  .bar { display:flex; align-items:center; gap:4px; margin:1px 0; }
  .bar i { width:2.2em; font-style:normal; color:var(--dim); font-size:.9em; }
  .bar b { flex:1; height:6px; background:#2a2420; display:block; } .bar b u { display:block; height:100%; }
  .bar span { width:3.6em; text-align:right; color:var(--text); font-size:.9em; }
  #menu button { flex:1; min-height:0; background:#120f0e; color:var(--text); border:1px solid var(--line); font:inherit; font-size:clamp(11px,3.2vmin,15px); border-radius:2px; cursor:pointer; padding:2px 4px; }
  #menu button.on, #menu button:active { border-color:var(--gold); color:var(--gold); }
  #menu .row2 { display:flex; gap:4px; flex:1; min-height:0; }
  #st { position:fixed; inset:0; z-index:20; display:none; flex-direction:column; gap:6px; padding:10px; background:rgba(8,7,10,.97); font-size:14px; }
  #st .r { display:flex; gap:6px; align-items:center; }
  #st input[type=text] { flex:1; min-width:0; background:#120f0e; color:var(--text); border:1px solid var(--line); font:inherit; padding:8px; }
  #st button { background:#120f0e; color:var(--text); border:1px solid var(--line); font:inherit; padding:8px 10px; }
  #st button.warn { border-color:#b05a4a; color:#e08a7a; }
  #stList { flex:1; min-height:0; overflow-y:auto; border:1px solid var(--line); }
  #stList .it { display:flex; gap:6px; align-items:center; padding:6px 8px; border-bottom:1px solid #2a2420; }
  #stList .it span { flex:1; } #stList .it small { color:var(--dim); }
  #stTa { height:22%; background:#120f0e; color:var(--text); border:1px solid var(--line); font:12px monospace; padding:6px; }
  #io { position:fixed; inset:0; z-index:20; display:none; flex-direction:column; gap:8px; padding:12px; background:rgba(8,7,10,.97); }
  #io textarea { flex:1; background:#120f0e; color:var(--text); border:1px solid var(--line); font:12px monospace; padding:8px; }
  #io .btns { display:flex; gap:8px; }
  #io button { flex:1; padding:10px; background:#120f0e; color:var(--text); border:1px solid var(--line); font:inherit; }
  #start, #rot { position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; text-align:center;
    background:rgba(8,7,10,.96); font-size:18px; letter-spacing:.1em; padding:20px; line-height:1.9; }
  #rot { display:none; z-index:31; }
  @media (orientation:portrait) { #rot { display:flex; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="bgimg"></div><div id="bgshade"></div>
    <div id="ver">戦闘盤 見本 v1.6</div>
    <button id="bMenu">☰ 設定</button>
    <div id="field"><div id="board"><div id="grid"></div></div></div>
    <div id="params"></div>
    <div id="win"><div id="msg"></div><span id="caret">▼</span></div>
  </div>
  <div id="menu">
    <button id="bMenuClose">▲ 閉じる</button>
    <button id="bEdit">編集：OFF</button>
    <div class="row2"><button id="bCp">横＋</button><button id="bCm">横－</button></div>
    <div class="row2"><button id="bRp">縦＋</button><button id="bRm">縦－</button></div>
    <div class="sl">角度<input type="range" id="sTilt" min="20" max="80" step="1"></div>
    <div class="sl">回転<input type="range" id="sYaw" min="-60" max="60" step="1"></div>
    <div class="sl">左右<input type="range" id="sOx" min="-300" max="300" step="2"></div>
    <div class="sl">上下<input type="range" id="sOy" min="-200" max="200" step="2"></div>
    <div class="sl">大きさ<input type="range" id="sScale" min="50" max="140" step="1"></div>
    <button id="bBg">背景を変える</button>
    <button id="bClear">障害物を全消去</button>
    <button id="bSt">戦闘の保存／一覧</button>
    <button id="bIo">この盤だけ書き出し</button>
  </div>
</div>

<div id="st">
  <div class="r"><input type="text" id="stName" placeholder="戦闘の名前（例：1章 廊下の戦い）"><button id="stSave">今の盤を保存</button></div>
  <div id="stList"></div>
  <textarea id="stTa" spellcheck="false" placeholder="まとめて書き出し／読込の文字がここに出ます"></textarea>
  <div class="r"><button id="stExport">全部を書き出す</button><button id="stImport">この文字を読み込む</button><button id="stClose" style="margin-left:auto">閉じる</button></div>
</div>

<div id="io">
  <div>下の文字をコピーすると、この盤を保存できます。貼り付けて「読み込む」で再現します。</div>
  <textarea id="ta" spellcheck="false"></textarea>
  <div class="btns"><button id="ioLoad">読み込む</button><button id="ioClose">閉じる</button></div>
</div>

<div id="start">タップして開始<br>（全画面・横向きになります）</div>
<div id="rot">スマホを横向きにしてください</div>

<script>
(function(){
  var BGS = ['corridor','factory','hospital','mansion','prison','sewage','lab','parking'];
  var TILT = 55;
  var $ = function(id){ return document.getElementById(id); };
  var stage = $('stage'), field = $('field'), board = $('board'), grid = $('grid');

  var S = { cols:8, rows:6, cells:[], bg:0, tilt:55, yaw:0, ox:0, oy:0, scale:100,
    units:[
      {id:'a1', side:'ally', c:6, r:5, name:'探索者A', hp:12, mhp:12, mp:8, mmp:10, san:62, msan:70},
      {id:'a2', side:'ally', c:7, r:3, name:'探索者B', hp:9, mhp:11, mp:5, mmp:6, san:48, msan:55},
      {id:'e1', side:'enemy', c:1, r:0, name:'影の群れ', hp:20, mhp:20, mp:0, mmp:0},
      {id:'e2', side:'enemy', c:0, r:2, name:'歪んだ者', hp:14, mhp:16, mp:3, mmp:3} ] };
  var edit = false, selected = null, size = 60;

  function key(c,r){ return r*100+c; }
  function cellAt(c,r){ return S.cells[key(c,r)] || 0; }
  function unitAt(c,r){ for (var i=0;i<S.units.length;i++){ var u=S.units[i]; if (u.c===c && u.r===r) return u; } return null; }
  function save(){ try{ localStorage.setItem('battleBoardV2', JSON.stringify(S)); }catch(e){} }
  function load(){ try{ var t = localStorage.getItem('battleBoardV2'); if (t) apply(JSON.parse(t)); }catch(e){} }
  function apply(o){
    if (!o || !o.cols || !o.rows) return;
    S.cols = Math.max(3, Math.min(14, o.cols|0)); S.rows = Math.max(3, Math.min(12, o.rows|0));
    S.cells = o.cells || {}; S.bg = (o.bg|0) % BGS.length; S.tilt = o.tilt||55; S.yaw = o.yaw||0; S.ox = o.ox||0; S.oy = o.oy||0; S.scale = o.scale||100;
    if (o.units && o.units.length) S.units = o.units;
    clampUnits();
  }
  function clampUnits(){
    S.units.forEach(function(u){
      u.c = Math.min(S.cols-1, Math.max(0,u.c)); u.r = Math.min(S.rows-1, Math.max(0,u.r));
      delete S.cells[key(u.c,u.r)];
    });
  }

  function fit(){
    TILT = S.tilt;
    var W = field.clientWidth, H = field.clientHeight;
    var cos = Math.cos(TILT*Math.PI/180), y = Math.abs(S.yaw)*Math.PI/180;
    var ex = S.cols*Math.cos(y) + S.rows*Math.sin(y), ey = (S.rows*Math.cos(y) + S.cols*Math.sin(y))*cos;
    size = Math.min(W*0.88/ex, H*0.66/ey, 90) * S.scale/100;
    size = Math.max(Math.floor(size), 18);
  }

  function render(){
    fit();
    var w = S.cols*size, h = S.rows*size;
    board.style.width = w+'px'; board.style.height = h+'px';
    board.style.marginLeft = (-w/2 + (S.ox||0))+'px'; board.style.marginTop = (-h/2 + (S.oy||0))+'px';
    board.style.transform = 'rotateX('+TILT+'deg) rotateZ('+S.yaw+'deg)';
    grid.style.width = w+'px'; grid.style.height = h+'px';
    grid.style.gridTemplateColumns = 'repeat('+S.cols+','+size+'px)';
    grid.style.gridTemplateRows = 'repeat('+S.rows+','+size+'px)';
    $('bgimg').style.backgroundImage = 'url(../assets/bg/'+BGS[S.bg]+'.webp)';
    // 以前の立体物を消す
    Array.prototype.slice.call(board.querySelectorAll('.bb, .blk')).forEach(function(n){ n.remove(); });
    grid.innerHTML = '';
    for (var r=0;r<S.rows;r++) for (var c=0;c<S.cols;c++){
      var d = document.createElement('div');
      d.className = 'cell' + ((r+c)%2 ? ' alt':'');
      d.dataset.c = c; d.dataset.r = r;
      if (selected && selected.c===c && selected.r===r) d.classList.add('sel');
      d.onclick = onCell;
      grid.appendChild(d);
      var t = cellAt(c,r);
      if (t) addObstacle(c,r,t);
    }
    S.units.forEach(addUnit);
    renderParams();
    $('bEdit').textContent = edit ? '編集：ON' : '編集：OFF';
    $('bEdit').classList.toggle('on', edit);
  }

  function place(el, c, r, wpx, hpx){
    el.style.width = wpx+'px'; el.style.height = hpx+'px';
    el.style.left = ((c+.5)*size)+'px'; el.style.top = ((r+.62)*size)+'px';
    el.style.transform = 'translate(-50%,-100%) rotateZ('+(-S.yaw)+'deg) rotateX(-'+TILT+'deg)';
  }
  // 迫り上がるマス：1=低い木箱（半マス）、2=高い岩（1マス）
  function addObstacle(c,r,t){
    var H = size*(t===1 ? 0.5 : 1.0), g = Math.max(1, Math.round(size*0.015));
    var b = document.createElement('div'); b.className = 'blk ' + (t===1 ? 'wood' : 'rock');
    b.style.left = (c*size)+'px'; b.style.top = (r*size)+'px'; b.style.width = size+'px'; b.style.height = size+'px';
    function face(cls, css){
      var f = document.createElement('div'); f.className = 'f ' + cls;
      Object.keys(css).forEach(function(k){ f.style[k] = css[k]; });
      f.onclick = function(){ cellTap(c, r); };
      b.appendChild(f); return f;
    }
    var px = function(v){ return v+'px'; };
    face('top',   { left:'0', top:'0', width:px(size), height:px(size), transform:'translateZ('+px(H)+')' });
    face('front', { left:'0', top:px(size), width:px(size), height:px(H), transformOrigin:'50% 0', transform:'rotateX(90deg)' });
    face('side',  { left:px(size), top:'0', width:px(H), height:px(size), transformOrigin:'0 50%', transform:'rotateY(-90deg)' });
    face('side',  { left:px(-H), top:'0', width:px(H), height:px(size), transformOrigin:'100% 50%', transform:'rotateY(90deg)' });
    board.appendChild(b);
  }
  // 一番近い敵（味方から見れば敵、敵から見れば味方）の方向を向く。画面の右なら反転。
  function flipOf(u){
    var best = null, bd = 1e9;
    S.units.forEach(function(o){
      if (o.side === u.side) return;
      var d = (o.c-u.c)*(o.c-u.c) + (o.r-u.r)*(o.r-u.r);
      if (d < bd){ bd = d; best = o; }
    });
    if (!best) return u.side === 'enemy';
    var yw = S.yaw*Math.PI/180, dc = best.c-u.c, dr = best.r-u.r;
    var sx = dc*Math.cos(yw) - dr*Math.sin(yw);    // 画面上の左右
    if (Math.abs(sx) < 0.01) return u._flip === undefined ? (u.side === 'enemy') : u._flip;
    u._flip = sx > 0; return u._flip;
  }
  function updateFacing(){
    S.units.forEach(function(u){ if (u.el && u.el.firstChild) u.el.firstChild.style.transform = flipOf(u) ? 'scaleX(-1)' : ''; });
  }
  function addUnit(u){
    var el = document.createElement('div'); el.className = 'bb unit ' + u.side;
    var h = size*1.5;
    place(el, u.c, u.r, h*469/811, h);
    el.style.transition = 'left .4s ease, top .4s ease';
    var img = document.createElement('img');
    img.src = '../assets/chara/sample_' + (u.side==='ally' ? 'back' : 'front') + '.webp';
    if (flipOf(u)) img.style.transform = 'scaleX(-1)';
    el.appendChild(img);
    board.appendChild(el); u.el = el;
  }

  function onCell(e){ cellTap(+this.dataset.c, +this.dataset.r); }
  function cellTap(c, r){
    var u = unitAt(c,r);
    if (edit){
      if (u) return;
      var t = (cellAt(c,r)+1)%3;
      if (t) S.cells[key(c,r)] = t; else delete S.cells[key(c,r)];
      save(); render(); return;
    }
    if (u && u.side==='ally'){ selected = (selected===u) ? null : u; render2(); say(selected ? '味方を選んだ。\nどこへ動く？' : '選びなおした。'); return; }
    if (selected && !u && !cellAt(c,r)){
      var m = selected;
      m.c = c; m.r = r; updateFacing(); selected = null; save(); render2(); say('味方は 素早く移動した。');
      if (m.el){ m.el.style.left = ((c+.5)*size)+'px'; m.el.style.top = ((r+.62)*size)+'px'; setTimeout(render, 450); } else render();
      return;
    }
    selected = null; render2();
  }
  // 選択の見た目だけ更新（作り直さない）
  function bar(l, v, m, col){ var pct = m ? Math.max(0,Math.min(100,v/m*100)) : 0;
    return '<div class="bar"><i>'+l+'</i><b><u style="width:'+pct+'%;background:'+col+'"></u></b><span>'+v+'/'+m+'</span></div>'; }
  function renderParams(){
    var h = '';
    S.units.forEach(function(u){
      if (!u.name) return;
      h += '<div class="pc '+u.side+(selected===u?' me':'')+'"><div class="pn">'+u.name+'</div>'
        + bar('HP', u.hp, u.mhp, '#c0554a') + (u.mmp ? bar('MP', u.mp, u.mmp, '#4a7ac0') : '')
        + (u.msan ? bar('SAN', u.san, u.msan, '#9a6ac0') : '') + '</div>';
    });
    $('params').innerHTML = h;
  }
  function render2(){
    renderParams();
    Array.prototype.forEach.call(grid.children, function(d){
      d.classList.toggle('sel', !!selected && selected.c===+d.dataset.c && selected.r===+d.dataset.r);
    });
  }

  $('bEdit').onclick = function(){ edit = !edit; selected = null; render();
    say(edit ? '編集モード。\nマスをタップすると、低い木箱→高い岩→なし の順で置ける。' : '編集を終えた。\n味方をタップして動かそう。'); };
  var tm = null;
  function say(t){
    clearInterval(tm); var i = 0, m = $('msg'); m.textContent = '';
    tm = setInterval(function(){ i++; m.textContent = t.slice(0,i); if (i>=t.length) clearInterval(tm); }, 28);
  }
  $('sTilt').value = S.tilt; $('sScale').value = S.scale; $('sYaw').value = S.yaw;
  $('sYaw').oninput = function(){ S.yaw = +this.value; save(); render(); };
  $('sOx').value = S.ox||0; $('sOy').value = S.oy||0;
  $('sOx').oninput = function(){ S.ox = +this.value; save(); render(); };
  $('sOy').oninput = function(){ S.oy = +this.value; save(); render(); };
  $('bMenu').onclick = function(){ $('menu').classList.toggle('open'); };
  $('bMenuClose').onclick = function(){ $('menu').classList.remove('open'); };
  $('sTilt').oninput = function(){ S.tilt = +this.value; save(); render(); };
  $('sScale').oninput = function(){ S.scale = +this.value; save(); render(); };
  function resize(dc, dr){
    S.cols = Math.max(3, Math.min(14, S.cols+dc)); S.rows = Math.max(3, Math.min(12, S.rows+dr));
    // 範囲外の障害物を消す
    Object.keys(S.cells).forEach(function(k){ var r=Math.floor(k/100), c=k%100; if (c>=S.cols||r>=S.rows) delete S.cells[k]; });
    clampUnits(); save(); render();
  }
  $('bCp').onclick = function(){ resize(1,0); };
  $('bCm').onclick = function(){ resize(-1,0); };
  $('bRp').onclick = function(){ resize(0,1); };
  $('bRm').onclick = function(){ resize(0,-1); };
  $('bBg').onclick = function(){ S.bg = (S.bg+1)%BGS.length; save(); render(); };
  $('bClear').onclick = function(){ S.cells = {}; save(); render(); };

  function stageObj(){
    return { cols:S.cols, rows:S.rows, bg:S.bg, tilt:S.tilt, yaw:S.yaw, ox:S.ox||0, oy:S.oy||0, scale:S.scale, cells:JSON.parse(JSON.stringify(S.cells)),
      units:S.units.map(function(u){ var q={}; Object.keys(u).forEach(function(k){ if (k!=='el') q[k]=u[k]; }); return q; }) };
  }
  function syncSliders(){ $('sTilt').value = S.tilt; $('sScale').value = S.scale; $('sYaw').value = S.yaw; $('sOx').value = S.ox||0; $('sOy').value = S.oy||0; }

  // ---- 戦闘の保存（名前付き）----
  var stages = {};
  try { stages = JSON.parse(localStorage.getItem('battleStagesV1') || '{}') || {}; } catch(e){ stages = {}; }
  function saveStages(){ try{ localStorage.setItem('battleStagesV1', JSON.stringify(stages)); }catch(e){} }
  var delArm = null;
  function renderStages(){
    var box = $('stList'); box.innerHTML = '';
    var names = Object.keys(stages);
    if (!names.length){ box.innerHTML = '<div class="it"><span style="color:#928b82">まだ保存した戦闘はありません</span></div>'; return; }
    names.forEach(function(n){
      var g = stages[n], row = document.createElement('div'); row.className = 'it';
      var sp = document.createElement('span'); sp.textContent = n; var sm = document.createElement('small'); sm.textContent = ' ' + g.cols + '×' + g.rows; sp.appendChild(sm);
      var bl = document.createElement('button'); bl.textContent = '読込';
      bl.onclick = function(){ apply(JSON.parse(JSON.stringify(g))); save(); syncSliders(); selected = null; render(); $('stName').value = n; $('st').style.display = 'none'; say('「' + n + '」を読み込んだ。'); };
      var bd = document.createElement('button'); bd.textContent = (delArm === n) ? '本当に消す？' : '消す'; if (delArm === n) bd.className = 'warn';
      bd.onclick = function(){ if (delArm === n){ delete stages[n]; saveStages(); delArm = null; } else { delArm = n; } renderStages(); };
      row.appendChild(sp); row.appendChild(bl); row.appendChild(bd); box.appendChild(row);
    });
  }
  $('bSt').onclick = function(){ $('menu').classList.remove('open'); delArm = null; renderStages(); $('st').style.display = 'flex'; };
  $('stClose').onclick = function(){ $('st').style.display = 'none'; };
  $('stSave').onclick = function(){
    var n = $('stName').value.replace(/^\s+|\s+$/g, '');
    if (!n){ $('stTa').value = '名前を入れてから保存してください。'; return; }
    stages[n] = stageObj(); saveStages(); delArm = null; renderStages(); $('stTa').value = '「' + n + '」を保存しました。';
  };
  $('stExport').onclick = function(){ $('stTa').value = JSON.stringify({ version:1, stages:stages }); };
  $('stImport').onclick = function(){
    try {
      var o = JSON.parse($('stTa').value), n = 0;
      var src = (o && o.stages) ? o.stages : null;
      if (!src) throw new Error('x');
      Object.keys(src).forEach(function(k){ stages[k] = src[k]; n++; });
      saveStages(); renderStages(); $('stTa').value = n + '件を読み込みました。';
    } catch(e){ $('stTa').value = '読み込めませんでした。「全部を書き出す」で出た文字を、そのまま貼り付けてください。'; }
  };

  $('bIo').onclick = function(){
    var o = stageObj();
    $('ta').value = JSON.stringify(o);
    $('io').style.display = 'flex';
  };
  $('ioClose').onclick = function(){ $('io').style.display = 'none'; };
  $('ioLoad').onclick = function(){
    try { apply(JSON.parse($('ta').value)); save(); syncSliders(); $('io').style.display='none'; render(); } catch(e){ $('ta').value = '読み込めませんでした。コピーした文字を、そのまま貼り付けてください。'; }
  };

  $('start').onclick = function(){
    this.style.display = 'none';
    var el = document.documentElement;
    try { (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch(e){}
    try { screen.orientation.lock('landscape').catch(function(){}); } catch(e){}
    setTimeout(render, 300); say('戦闘開始！\n味方をタップして、動かしたいマスをタップしよう。');
  };
  window.addEventListener('resize', function(){ setTimeout(render, 100); });

  load(); syncSliders(); render();
})();
</script>
</body>
</html>
