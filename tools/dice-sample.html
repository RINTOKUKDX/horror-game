<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ダイス 見本 v1.1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&display=swap">
<style>
  /* ダイスだけを試す見本。ゲーム本体・ゲーム画面見本には影響しない */
  :root{ --gold:#c7b07c; --fg:#e8e2da; --serif:'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN',serif; color-scheme:dark }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{width:100vw;height:100dvh;overflow:hidden;background:#020204;color:var(--fg);font-family:var(--serif);touch-action:none}
  button{font-family:inherit;color:inherit}
  #bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.32) saturate(.6)}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  /* カットイン（シックでレトロ） */
  #band{position:absolute;left:0;right:0;top:2dvh;padding:.9dvh 6vw .9dvh;text-align:center;color:#e8d9b0;pointer-events:none;
    background:linear-gradient(180deg,#1b130b,#2a1c0e 50%,#1b130b);border-top:2px solid #a8864a;border-bottom:2px solid #a8864a;
    box-shadow:0 0 0 1px #3a2a14,0 1dvh 3dvh rgba(0,0,0,.8)}
  #band.in{animation:bandIn .4s ease-out}
  @keyframes bandIn{from{transform:translateX(-100%)}to{transform:none}}
  #band .t{font-size:3.6dvh;letter-spacing:.3em;color:var(--gold)}
  #band .c{font-size:2.4dvh;margin-top:.2dvh;color:#cdbb90}
  #scale{position:relative;height:1dvh;margin:.8dvh auto 0;width:46vw;background:#3a1010;border:1px solid #a8864a}
  #fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#8a6a2a,#d4b060)}
  #mark{position:absolute;top:-.8dvh;bottom:-.8dvh;width:3px;margin-left:-1px;background:#fff;opacity:0;box-shadow:0 0 6px #fff;transition:left .3s}
  /* 結果は左側に出す（真ん中はトレイ） */
  #res{position:absolute;left:calc(1vw + env(safe-area-inset-left,0px));width:27vw;top:30dvh;text-align:center;opacity:0;pointer-events:none}
  #res.on{opacity:1;animation:resIn .4s ease-out}
  @keyframes resIn{from{transform:scale(1.3);opacity:0}to{transform:none;opacity:1}}
  #res b{display:block;font-size:14dvh;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
  #res span{display:block;font-size:5dvh;letter-spacing:.4em;margin-top:.6dvh}
  #res small{display:block;font-size:2.6dvh;margin-top:.6dvh;color:#cdbb90;letter-spacing:.05em;line-height:1.4}
  #res.ok b,#res.ok span{color:#e6c877;text-shadow:0 0 2.5dvh rgba(230,200,110,.6)}
  #res.ng b,#res.ng span{color:#c03d3d;text-shadow:0 0 2.5dvh rgba(150,20,20,.75)}
  #res.sum b{color:#efe3c4;text-shadow:0 0 2dvh rgba(0,0,0,.9)}
  #flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(120,0,0,.0),rgba(120,0,0,.65))}
  #flash.on{animation:flash .9s ease-out}
  @keyframes flash{0%{opacity:1}100%{opacity:0}}
  #hint{position:absolute;left:calc(2vw + env(safe-area-inset-left,0px));bottom:7dvh;width:26vw;text-align:center;font-size:2.8dvh;color:#cdbb90;letter-spacing:.15em;pointer-events:none;animation:hint 1.4s ease-in-out infinite}
  @keyframes hint{50%{opacity:.35}}
  /* 右下：設定 */
  #tool{position:absolute;right:calc(2vw + env(safe-area-inset-right,0px));bottom:2dvh;display:flex;flex-direction:column;align-items:flex-end;gap:1dvh}
  #toggle{font-size:2.8dvh;padding:.8dvh 1.6vw;background:rgba(20,14,8,.85);border:1px solid #a8864a;border-radius:3px}
  #panel{display:none;width:40vw;max-height:80dvh;overflow:auto;padding:1.2dvh 1.2vw 1.6dvh;background:rgba(14,10,6,.86);border:1px solid #a8864a;border-radius:4px;touch-action:pan-y}
  #panel.on{display:block}
  .tabs{display:flex;gap:.4vw;margin-bottom:1dvh;position:sticky;top:-1.2dvh;background:rgba(14,10,6,.97);padding:.6dvh 0}
  .tabs button{flex:1;font-size:2.6dvh;padding:.9dvh 0;background:#1c140c;border:1px solid #4a3a22;border-radius:3px}
  .tabs button.on{border-color:#d4b060;color:#f0d890;background:#2a1e10}
  .tab{display:none}.tab.on{display:block}
  #panel .g{display:grid;grid-template-columns:repeat(4,1fr);gap:.8dvh .6vw}
  #panel .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8dvh .6vw;margin-top:1dvh}
  #panel .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.8dvh .6vw;margin-top:1dvh}
  #panel button.f{font-size:2.5dvh;padding:1dvh .3vw;background:#1c140c;border:1px solid #4a3a22;border-radius:3px}
  #panel button.f.sel{border-color:#d4b060;color:#f0d890;background:#2a1e10}
  #panel label{display:flex;align-items:center;gap:1vw;font-size:2.5dvh;margin-top:1.3dvh}
  #panel label .n{flex:0 0 11.5em;font-size:2.4dvh}
  #panel label .v{flex:0 0 3.6em;text-align:right;color:#f0d890;font-variant-numeric:tabular-nums}
  #panel input[type=range]{flex:1;min-width:0;accent-color:#c7a35a}
  #panel input[type=text]{flex:1;font-family:inherit;font-size:16px;padding:.6dvh .6vw;background:#0c0a08;color:#e8e2da;border:1px solid #4a3a22;border-radius:3px;user-select:text}
  #panel textarea{width:100%;height:16dvh;margin-top:1dvh;font-size:16px;font-family:monospace;padding:.6dvh .6vw;background:#0c0a08;color:#e8e2da;border:1px solid #4a3a22;border-radius:3px;user-select:text;-webkit-user-select:text}
  #panel .row{display:flex;gap:.6vw;margin-top:1.2dvh}
  #panel .row button{flex:1;font-size:2.5dvh;padding:1dvh 0;background:#1c140c;border:1px solid #4a3a22;border-radius:3px}
  #panel h4{font-size:2.4dvh;color:#a8946a;font-weight:600;margin-top:1.4dvh}
  #panel p{font-size:2.2dvh;color:#9a8c72;margin-top:1dvh;line-height:1.5}
  #start{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2dvh;background:#050403;cursor:pointer}
  #start b{font-size:6dvh;color:var(--gold);letter-spacing:.2em}
  #start span{font-size:3dvh;color:#a89c84}
  .ver{position:absolute;left:calc(1.5vw + env(safe-area-inset-left,0px));bottom:1dvh;font-size:2.2dvh;color:#6c6455;pointer-events:none}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="cv"></canvas>
<div id="flash"></div>
<div id="band"><div class="t" id="bandT">目星</div><div class="c" id="bandC"></div><div id="scale"><i id="fill"></i><i id="mark"></i></div></div>
<div id="res"><b></b><span></span><small></small></div>
<div id="hint">ダイスをつかんで<br>投げる ➚</div>
<div id="tool">
  <div id="panel">
    <div class="tabs"><button type="button" data-t="f" class="on">式</button><button type="button" data-t="m">動き</button><button type="button" data-t="t">トレイ</button><button type="button" data-t="s">音</button><button type="button" data-t="c">保存</button></div>
    <div class="tab on" id="tab-f">
      <div class="g" id="forms"></div>
      <label><span class="n" style="flex-basis:5em">目標値</span><input type="range" id="target" min="1" max="99" value="60"><span class="v" id="tv">60</span></label>
      <label><span class="n" style="flex-basis:2em">式</span><input type="text" id="formula" value="1D100" autocomplete="off"></label>
      <div class="row"><button type="button" id="apply">この式にする</button><button type="button" id="gather">ダイスを戻す</button></div>
      <p>1D100のときは技能の判定（目標値以下で成功）。それ以外は合計を出します。画面に出すダイスは8個まで。</p>
    </div>
    <div class="tab" id="tab-m"></div>
    <div class="tab" id="tab-t"></div>
    <div class="tab" id="tab-s">
      <h4>音の種類</h4><div class="g3" id="tones"></div>
      <h4>部屋の響き</h4><div class="g4" id="rooms"></div>
      <div id="sndSliders"></div>
      <div class="row"><button type="button" id="testSnd">音を試す</button></div>
    </div>
    <div class="tab" id="tab-c">
      <p>調整が終わったら「設定をコピー」を押して、チャットに貼ってください。その値でゲームに固定します。設定はこの端末に自動で保存されます。</p>
      <div class="row"><button type="button" id="copy">設定をコピー</button><button type="button" id="reset">最初の値に戻す</button></div>
      <textarea id="cfgtxt" readonly></textarea>
    </div>
  </div>
  <button type="button" id="toggle">☰ 設定</button>
</div>
<div class="ver">ダイス 見本 v1.1</div>
<div id="start"><b>タップして始める</b><span>全画面・横向きになります（音が出ます）</span><span>ダイスを指でつかんで、はじくように投げる</span><span style="font-size:2.4dvh;color:#6c6455">ダイス 見本 v1.1</span></div>

<script src="../assets/manifest.js"></script>
<script>
(function(){
  'use strict';
  var $=function(id){ return document.getElementById(id); };
  var PI=Math.PI;

  // ===== 調整できる値（右下の設定で変えられる。端末に保存） =====
  var DEF={friction:.15,rollDamp:.1,bounce:.5,wallBounce:.7,power:1.2,speed:.8,
    trayR:7.2,trayRot:0,pitch:58,dist:35,offY:.06,
    vol:.8,tone:'metal',room:'hall',wet:.45,decay:2.2,rollVol:.7};
  var CFG={}; Object.keys(DEF).forEach(function(k){ CFG[k]=DEF[k]; });
  try{ var sv=JSON.parse(localStorage.getItem('diceCfg1')||'{}'); Object.keys(DEF).forEach(function(k){ if(sv[k]!==undefined && typeof sv[k]===typeof DEF[k]) CFG[k]=sv[k]; }); }catch(_){ }
  function saveCfg(){ try{ localStorage.setItem('diceCfg1',JSON.stringify(CFG)); }catch(_){ } }

  // ===== 小さな3D計算 =====
  function v3(x,y,z){ return {x:x,y:y,z:z}; }
  function add(a,b){ return v3(a.x+b.x,a.y+b.y,a.z+b.z); }
  function sub(a,b){ return v3(a.x-b.x,a.y-b.y,a.z-b.z); }
  function mul(a,s){ return v3(a.x*s,a.y*s,a.z*s); }
  function dot(a,b){ return a.x*b.x+a.y*b.y+a.z*b.z; }
  function cross(a,b){ return v3(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x); }
  function len(a){ return Math.sqrt(dot(a,a)); }
  function norm(a){ var l=len(a)||1; return mul(a,1/l); }
  function lerp(a,b,t){ return add(a,mul(sub(b,a),t)); }
  function q(w,x,y,z){ return {w:w,x:x,y:y,z:z}; }
  function qmul(a,b){ return q(a.w*b.w-a.x*b.x-a.y*b.y-a.z*b.z, a.w*b.x+a.x*b.w+a.y*b.z-a.z*b.y, a.w*b.y-a.x*b.z+a.y*b.w+a.z*b.x, a.w*b.z+a.x*b.y-a.y*b.x+a.z*b.w); }
  function qnorm(a){ var l=Math.sqrt(a.w*a.w+a.x*a.x+a.y*a.y+a.z*a.z)||1; return q(a.w/l,a.x/l,a.y/l,a.z/l); }
  function qaxis(ax,ang){ var s=Math.sin(ang/2); ax=norm(ax); return q(Math.cos(ang/2),ax.x*s,ax.y*s,ax.z*s); }
  function qrot(a,v){ var p=qmul(qmul(a,q(0,v.x,v.y,v.z)),q(a.w,-a.x,-a.y,-a.z)); return v3(p.x,p.y,p.z); }
  function qdot(a,b){ return Math.abs(a.w*b.w+a.x*b.x+a.y*b.y+a.z*b.z); }
  function qfromto(a,b){ a=norm(a); b=norm(b); var d=dot(a,b);
    if(d<-0.9999){ var ax=cross(v3(1,0,0),a); if(len(ax)<1e-3) ax=cross(v3(0,0,1),a); return qaxis(ax,PI); }
    var c=cross(a,b); return qnorm(q(1+d,c.x,c.y,c.z)); }
  function qslerp(a,b,t){ var d=a.w*b.w+a.x*b.x+a.y*b.y+a.z*b.z; if(d<0){ b=q(-b.w,-b.x,-b.y,-b.z); d=-d; }
    if(d>0.9995) return qnorm(q(a.w+(b.w-a.w)*t,a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,a.z+(b.z-a.z)*t));
    var th=Math.acos(d), s=Math.sin(th), wa=Math.sin((1-t)*th)/s, wb=Math.sin(t*th)/s;
    return q(a.w*wa+b.w*wb,a.x*wa+b.x*wb,a.y*wa+b.y*wb,a.z*wa+b.z*wb); }
  function rng(seed){ return function(){ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; }; }

  // ===== ダイスの形（外接半径1に正規化） =====
  function finish(shape, sum){
    var V=shape.scaleZ?shape.verts.slice():shape.verts.map(function(p){ return norm(p); });
    var faces=shape.faces.map(function(ix){
      var c=v3(0,0,0); ix.forEach(function(i){ c=add(c,V[i]); }); c=mul(c,1/ix.length);
      var n=norm(cross(sub(V[ix[1]],V[ix[0]]),sub(V[ix[2]],V[ix[0]])));
      if(dot(n,c)<0){ ix=ix.slice().reverse(); n=mul(n,-1); }
      return {ix:ix,n:n,c:c,val:null};
    });
    if(shape.values){ faces.forEach(function(f,i){ f.val=shape.values(f,i); }); }
    else{
      var next=shape.min; faces.forEach(function(f){ if(f.val!==null) return; var o=null, best=2;
        faces.forEach(function(g){ if(g!==f && g.val===null){ var d=dot(f.n,g.n); if(d<best){ best=d; o=g; } } });
        f.val=next; if(o) o.val=sum-next; next++; });
    }
    var maxR=0; V.forEach(function(p){ maxR=Math.max(maxR,len(p)); });
    return {verts:V.map(function(p){ return mul(p,1/maxR); }),faces:faces.map(function(f){ f.c=mul(f.c,1/maxR); return f; }),kind:shape.kind,sides:shape.sides};
  }
  var SHAPES={};
  (function(){
    SHAPES[4]=finish({kind:4,sides:4,verts:[v3(1,1,1),v3(1,-1,-1),v3(-1,1,-1),v3(-1,-1,1)],faces:[[0,1,2],[0,3,1],[0,2,3],[1,3,2]],values:function(){ return 0; }},0);
    SHAPES[4].vval=[1,2,3,4];
    SHAPES[6]=finish({kind:6,sides:6,verts:[v3(-1,-1,-1),v3(1,-1,-1),v3(1,1,-1),v3(-1,1,-1),v3(-1,-1,1),v3(1,-1,1),v3(1,1,1),v3(-1,1,1)],
      faces:[[0,3,2,1],[4,5,6,7],[0,1,5,4],[2,3,7,6],[1,2,6,5],[0,4,7,3]],min:1},7);
    var o=[v3(1,0,0),v3(-1,0,0),v3(0,1,0),v3(0,-1,0),v3(0,0,1),v3(0,0,-1)];
    SHAPES[8]=finish({kind:8,sides:8,verts:o,faces:[[0,2,4],[2,1,4],[1,3,4],[3,0,4],[2,0,5],[1,2,5],[3,1,5],[0,3,5]],min:1},9);
    var e=(1-Math.cos(PI/5))/(1+Math.cos(PI/5)), V10=[], F10=[];
    for(var i=0;i<10;i++){ var a=i*PI/5; V10.push(v3(Math.cos(a),(i%2?-e:e),Math.sin(a))); }
    V10.push(v3(0,1,0)); V10.push(v3(0,-1,0));
    for(var k=0;k<5;k++){ F10.push([10,(2*k)%10,(2*k+1)%10,(2*k+2)%10]); F10.push([11,(2*k+1)%10,(2*k+2)%10,(2*k+3)%10]); }
    SHAPES[10]=finish({kind:10,sides:10,verts:V10,faces:F10,min:0,scaleZ:true},9);
    var t=(1+Math.sqrt(5))/2, I=[v3(-1,t,0),v3(1,t,0),v3(-1,-t,0),v3(1,-t,0),v3(0,-1,t),v3(0,1,t),v3(0,-1,-t),v3(0,1,-t),v3(t,0,-1),v3(t,0,1),v3(-t,0,-1),v3(-t,0,1)];
    SHAPES[20]=finish({kind:20,sides:20,verts:I,faces:[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]],min:1},21);
  })();

  // ===== 画面とカメラ =====
  var cv=$('cv'), ctx=cv.getContext('2d'), W=0, H=0, DPR=1, CY=0;
  var CAM={C:v3(0,27,5),T:v3(0,0,0),fov:30}, R3, U3, F3, FOC;
  var PLANES=[], TRAY={R:7,rim:.85,h:1.5,ap:6};
  var bgC=document.createElement('canvas'), bgx=bgC.getContext('2d'), fgC=document.createElement('canvas'), fgx=fgC.getContext('2d');
  function setupCamera(){
    var th=CFG.pitch*PI/180, D=CFG.dist;
    CAM.C=v3(0,D*Math.sin(th),D*Math.cos(th)); CAM.T=v3(0,0,0);
    F3=norm(sub(CAM.T,CAM.C)); R3=norm(cross(F3,v3(0,1,0))); U3=cross(R3,F3);
    FOC=(H/2)/Math.tan(CAM.fov*PI/360); CY=H*(.5+CFG.offY);
  }
  function proj(P){ var d=sub(P,CAM.C), zc=dot(d,F3); return {x:W/2+dot(d,R3)/zc*FOC, y:CY-dot(d,U3)/zc*FOC, z:zc}; }
  function screenRay(sx,sy){ return add(F3,add(mul(R3,(sx-W/2)/FOC),mul(U3,-(sy-CY)/FOC))); }
  function atHeight(sx,sy,y){ var dir=screenRay(sx,sy); var t=(y-CAM.C.y)/dir.y; return add(CAM.C,mul(dir,t)); }
  function hexAng(i){ return CFG.trayRot*PI/180+i*PI/3; }
  function hexPt(i,rad,y){ var a=hexAng(i); return v3(rad*Math.cos(a),y,rad*Math.sin(a)); }
  function buildTray(){
    TRAY.R=CFG.trayR; TRAY.ap=TRAY.R*Math.cos(PI/6);
    PLANES=[{n:v3(0,1,0),d:0,floor:true}];
    for(var i=0;i<6;i++){ var m=hexAng(i)+PI/6; PLANES.push({n:v3(-Math.cos(m),0,-Math.sin(m)),d:-TRAY.ap,wall:true}); }
  }
  // トレイの内側に収める（marginは壁からの距離）
  function clampIn(p,margin){ for(var i=1;i<PLANES.length;i++){ var pl=PLANES[i], dd=dot(pl.n,p)-(pl.d+margin); if(dd<0) p=sub(p,mul(pl.n,dd)); } return p; }
  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1); W=window.innerWidth; H=window.innerHeight; cv.width=W*DPR; cv.height=H*DPR;
    setupCamera(); buildTray(); buildLayers();
  }

  // ===== トレイの絵（変えたときだけ描き直して使い回す） =====
  function shade(hex,k){ var n=parseInt(hex.slice(1),16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    return 'rgb('+Math.max(0,Math.min(255,Math.round(r*k)))+','+Math.max(0,Math.min(255,Math.round(g*k)))+','+Math.max(0,Math.min(255,Math.round(b*k)))+')'; }
  var LIGHT=norm(v3(-0.45,1,0.35)), LIGHT2=norm(v3(.7,.45,-.5));
  function pathW(c,pts,close){ c.beginPath(); for(var k=0;k<pts.length;k++){ var s=proj(pts[k]); if(k) c.lineTo(s.x,s.y); else c.moveTo(s.x,s.y); } if(close!==false) c.closePath(); }
  function ringPts(cx,cz,r,y,n){ var a=[]; n=n||72; for(var i=0;i<n;i++){ var t=i/n*2*PI; a.push(v3(cx+r*Math.cos(t),y,cz+r*Math.sin(t))); } return a; }
  function hexPts(rad,y){ var a=[]; for(var i=0;i<6;i++) a.push(hexPt(i,rad,y)); return a; }
  function pxPerUnit(){ return FOC/CFG.dist; }
  var GLYPHS=(function(){ var r=rng(7), out=[]; for(var g=0;g<24;g++){ var s=[], n=2+Math.floor(r()*3);
    for(var k=0;k<n;k++){ var m=2+Math.floor(r()*2), st=[]; for(var j=0;j<m;j++) st.push([r()*2-1,r()*2-1]); s.push(st); }

      while(acc>=STEP && n<16){ acc-=STEP; n++; dice.forEach(function(d,i){ stepDie(d,STEP,i); }); collideDice(); }
      if(n>=16) acc=0;
      // 0.3秒ごとに動きを見て、ほとんど動いていなければ止める
      dice.forEach(function(d){ if(d.asleep||!d.chk) return; d.chk.t+=dt*CFG.speed;
        if(d.chk.t>=.3){ if(len(sub(d.p,d.chk.p))<.04 && qdot(d.q,d.chk.q)>.99996) sleep(d); d.chk={p:d.p,q:d.q,t:0}; }
        if(d.onFloor){ rollLvl+=Math.min(1,Math.sqrt(d.v.x*d.v.x+d.v.z*d.v.z)/14+len(d.w)/45); } });
      var all=dice.every(function(d){ return d.asleep; });
      if(rollT>18){ dice.forEach(sleep); all=true; }
      if(all){ state='settle'; dice.forEach(function(d){ settleIfTilted(d); }); }
    }
    if(AC && ROLLG){ var lv=Math.min(1,rollLvl); ROLLG.gain.setTargetAtTime(lv*.5*CFG.rollVol,AC.currentTime,.05); ROLLF.frequency.setTargetAtTime(220+900*lv,AC.currentTime,.05); }
    if(settling.length){
      settling.forEach(function(s){ s.t=Math.min(1,s.t+dt/.28); var e=s.t*s.t*(3-2*s.t); s.d.q=qslerp(s.from,s.to,e); if(s.onFloor) s.d.p.y+=-lowest(s.d); if(s.t>=1 && !s.done){ s.done=true; hit('floor',.12); } });
      settling=settling.filter(function(s){ return s.t<1; });
    }
    if(state==='settle' && !settling.length && !resultShown){ state='done'; resTimer=setTimeout(showResult,220); }
    draw(); requestAnimationFrame(frame);
  }

  // ===== 右下の設定 =====
  ['1D100','1D3','1D4','1D6','2D6','3D6','1D8','1D10','1D20','2D6+1D4','1D6+1D4','8D6'].forEach(function(fs){
    var b=document.createElement('button'); b.type='button'; b.className='f'; b.textContent=fs;
    b.addEventListener('click',function(){ formula=fs; $('formula').value=fs; setupDice(); }); $('forms').appendChild(b); });
  var SL=[
    ['tab-m','friction','床のすべりにくさ',.05,.9,.01],['tab-m','rollDamp','転がりの止まりやすさ',0,1.5,.01],['tab-m','bounce','床の跳ね返り',0,.8,.01],
    ['tab-m','wallBounce','壁の跳ね返り',0,.9,.01],['tab-m','power','投げる強さ',.4,2,.01],['tab-m','speed','動きの速さ（小さいほどスロー）',.4,1.2,.01],
    ['tab-t','trayR','トレイの大きさ',4.5,10,.1],['tab-t','trayRot','トレイの回転（度）',0,59,1],['tab-t','pitch','見下ろす角度（度）',35,88,1],
    ['tab-t','dist','カメラの距離（全体の大きさ）',18,50,.5],['tab-t','offY','上下の位置',-.2,.3,.01],
    ['sndSliders','vol','音量',0,1,.01],['sndSliders','wet','響きの量',0,1,.01],['sndSliders','decay','響きの長さ（秒）',.2,6,.1],['sndSliders','rollVol','転がる音の大きさ',0,1,.01]];
  var inputs={};
  function fmt(v,st){ return st>=1?String(Math.round(v)):st>=.1?v.toFixed(1):v.toFixed(2); }
  SL.forEach(function(s){
    var lb=document.createElement('label'); lb.innerHTML='<span class="n">'+s[2]+'</span><input type="range" min="'+s[3]+'" max="'+s[4]+'" step="'+s[5]+'"><span class="v"></span>';
    var inp=lb.querySelector('input'), out=lb.querySelector('.v'); inp.value=CFG[s[1]]; out.textContent=fmt(CFG[s[1]],s[5]);
    inp.addEventListener('input',function(){ CFG[s[1]]=+inp.value; out.textContent=fmt(CFG[s[1]],s[5]); onCfg(s[1]); });
    inputs[s[1]]={inp:inp,out:out,st:s[5]}; $(s[0]).appendChild(lb); });
  var p1=document.createElement('p'); p1.textContent='すべりにくさを下げると長く滑り、止まりやすさを下げると長く転がります。'; $('tab-m').appendChild(p1);
  var p2=document.createElement('p'); p2.textContent='トレイは大きさ・回転・角度を変えるとすぐ描き直します。'; $('tab-t').appendChild(p2);
  var TONES=[['metal','金属'],['resin','樹脂'],['bone','骨・木']], ROOMS=[['none','なし',.3,0],['small','小部屋',.8,.3],['hall','石の広間',2.2,.45],['cathedral','大聖堂',4.5,.6]];
  function selBtns(box,list,key,after){ list.forEach(function(it){ var b=document.createElement('button'); b.type='button'; b.className='f'; b.textContent=it[1]; b.dataset.k=it[0];
    b.addEventListener('click',function(){ CFG[key]=it[0]; if(after) after(it); refreshSel(); onCfg(key); hit('dice',.7); }); $(box).appendChild(b); }); }
  function refreshSel(){ document.querySelectorAll('#tones button').forEach(function(b){ b.classList.toggle('sel',b.dataset.k===CFG.tone); });
    document.querySelectorAll('#rooms button').forEach(function(b){ b.classList.toggle('sel',b.dataset.k===CFG.room); }); }
  selBtns('tones',TONES,'tone');
  selBtns('rooms',ROOMS,'room',function(it){ CFG.decay=it[2]; CFG.wet=it[3]; ['decay','wet'].forEach(function(k){ inputs[k].inp.value=CFG[k]; inputs[k].out.textContent=fmt(CFG[k],inputs[k].st); }); });
  refreshSel();
  var trayTimer=0;
  function onCfg(k){
    saveCfg(); showCfg();
    if(['trayR','trayRot','pitch','dist','offY'].indexOf(k)>=0){
      setupCamera(); buildTray(); clearTimeout(trayTimer); trayTimer=setTimeout(buildLayers,30);
      if(state==='idle'||state==='done'){ dice.forEach(function(d){ d.p=clampIn(d.p,d.r*.9); }); if(k==='trayR'||k==='trayRot') placeHome(); }
    }
    if(['vol','wet','room'].indexOf(k)>=0) applyAudio();
    if(k==='decay'||k==='room'){ clearTimeout(irTimer); irTimer=setTimeout(function(){ buildIR(); applyAudio(); },250); }
  }
  function showCfg(){ var o={}; Object.keys(DEF).forEach(function(k){ o[k]=typeof CFG[k]==='number'?Math.round(CFG[k]*100)/100:CFG[k]; }); $('cfgtxt').value='ダイス設定 v1.1 '+JSON.stringify(o); }
  showCfg();
  $('copy').addEventListener('click',function(){ var tx=$('cfgtxt'), s=tx.value, btn=this;
    function done(){ btn.textContent='コピーしました'; setTimeout(function(){ btn.textContent='設定をコピー'; },1500); }
    try{ navigator.clipboard.writeText(s).then(done,function(){ tx.select(); try{ document.execCommand('copy'); done(); }catch(_){ } }); }catch(_){ tx.select(); try{ document.execCommand('copy'); done(); }catch(__){ } } });
  $('reset').addEventListener('click',function(){ Object.keys(DEF).forEach(function(k){ CFG[k]=DEF[k]; if(inputs[k]){ inputs[k].inp.value=CFG[k]; inputs[k].out.textContent=fmt(CFG[k],inputs[k].st); } });
    refreshSel(); saveCfg(); showCfg(); setupCamera(); buildTray(); buildLayers(); placeHome(); if(AC){ buildIR(); applyAudio(); } });
  $('testSnd').addEventListener('click',function(){ ac(); hit('wall',.8); setTimeout(function(){ hit('dice',.9); },180); setTimeout(function(){ hit('floor',.7); },360); setTimeout(function(){ hit('dice',.5); },470); });
  document.querySelectorAll('.tabs button').forEach(function(b){ b.addEventListener('click',function(){
    document.querySelectorAll('.tabs button').forEach(function(x){ x.classList.toggle('on',x===b); });
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('on',x.id==='tab-'+b.dataset.t); }); }); });
  $('toggle').addEventListener('click',function(){ $('panel').classList.toggle('on'); });
  $('target').addEventListener('input',function(){ target=+this.value; $('tv').textContent=target; if(isCheck()){ $('bandC').textContent='出目が '+target+' 以下で成功（1〜100）'; $('fill').style.width=target+'%'; } });
  $('apply').addEventListener('click',function(){ var fs=$('formula').value.toUpperCase().replace(/\s/g,''); if(parse(fs)){ formula=fs; setupDice(); } else { $('formula').value=formula; } });
  $('gather').addEventListener('click',function(){ setupDice(); });
  ['pointerdown','pointerup','click'].forEach(function(ev){ $('tool').addEventListener(ev,function(e){ e.stopPropagation(); }); });

  // ===== 始める（全画面・横向き） =====
  function isFull(){ return document.fullscreenElement||document.webkitFullscreenElement; }
  async function begin(){
    ac(); var el=document.documentElement;
    try{ if(!isFull()){ if(el.requestFullscreen) await el.requestFullscreen(); else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen(); } }catch(_){ }
    try{ if(screen.orientation&&screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(_){ }
    $('start').style.display='none'; setTimeout(function(){ resize(); setupDice(); },150);
  }
  $('start').addEventListener('click',begin);
  try{ var bgs=(window.ASSETS&&window.ASSETS.bg)||[]; var pick=bgs.indexOf('corridor')>=0?'corridor':bgs[0]; if(pick) $('bg').style.backgroundImage='url(../assets/bg/'+pick+'.webp)'; }catch(_){ }
  window.addEventListener('resize',function(){ resize(); if(state==='idle') placeHome(); });
  resize(); setupDice(); requestAnimationFrame(frame);
  window.__dice={get dice(){ return dice; },get state(){ return state; },setup:function(f){ formula=f; setupDice(); },cfg:CFG};
})();
</script>
