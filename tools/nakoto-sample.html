<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ナコト写本 見本 v1.7.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Shippori+Mincho:wght@400;600;700&display=swap">
<style>
  /* 机メニュー＋ナコト写本だけを試す見本。ゲーム本体には影響しない */
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{width:100vw;height:100dvh;overflow:hidden;background:#000;color:#e8e2da;font-family:'Shippori Mincho','Noto Serif JP',serif;touch-action:none}
  #start{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;text-align:center}
  #start b{font-size:20px;letter-spacing:.3em}
  #start span{font-size:13px;color:#9a8f80;letter-spacing:.15em}
  #start.hide{display:none}
  #portrait{position:fixed;inset:0;z-index:300;background:#000;display:none;align-items:center;justify-content:center;font-size:16px;letter-spacing:.2em}
  @media (orientation:portrait){#portrait{display:flex}}
  #dbg{position:fixed;z-index:150;left:max(10px,env(safe-area-inset-left,0px));bottom:8px;display:flex;gap:6px}
  #dbg button{min-height:40px;padding:6px 12px;background:rgba(20,14,8,.8);border:1px solid #6a5434;border-radius:4px;color:#e8dcc4;font-family:inherit;font-size:13px;letter-spacing:.08em}
  #adj{position:fixed;z-index:155;right:max(8px,env(safe-area-inset-right,0px));top:8px;bottom:8px;width:min(330px,40vw);display:none;flex-direction:column;background:rgba(14,10,6,.9);border:1px solid #6a5434;border-radius:5px;font-size:13px}
  #adj.on{display:flex}
  #adj{transition:opacity .35s}
  #adj.peek{opacity:.06}
  #adj.left{right:auto;left:max(8px,env(safe-area-inset-left,0px))}
  #adj .objs button.on{border-color:#d4b060;color:#f0d890;background:#2a1e10}
  #adj .pad{display:grid;grid-template-columns:repeat(3,44px);gap:4px;justify-content:center}
  #adj .pad button{padding:0}
  #adj .tabs{display:flex;gap:4px;padding:6px}
  #adj .tabs button,#adj button{min-height:36px;padding:4px 10px;font-family:inherit;font-size:13px;color:#e8dcc4;background:#1e160d;border:1px solid #4d3c25;border-radius:4px}
  #adj .tabs button{flex:1}#adj .tabs button.on{border-color:#d4b060;color:#f0d890;background:#2a1e10}
  #adj .pane{flex:1;overflow-y:auto;padding:4px 8px 8px;display:none;touch-action:pan-y}#adj .pane.on{display:block}
  #adj h4{font-size:13px;color:#e9d6ac;margin:6px 0;letter-spacing:.1em}
  #adj label{display:flex;align-items:center;gap:6px;margin:8px 0}
  #adj label span{flex:0 0 3.5em}#adj label b{flex:0 0 3em;text-align:right;color:#f0d890;font-weight:400}
  #adj input[type=range]{flex:1;min-width:0;accent-color:#c7a35a}
  #adj .row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  #adj .snd{display:flex;align-items:center;gap:4px;padding:4px 0;border-bottom:1px solid #2a2015}
  #adj .snd .t{flex:1;min-width:0}#adj .snd .t small{display:block;color:#9a8a6a;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #adj p{color:#9a8a6a;font-size:12px;line-height:1.6;margin:4px 0}
</style>
</head>
<body>
<div id="start"><b>タップして始める</b><span>全画面・横向きになります</span><span>ナコト写本 見本 v1.7.0</span></div>
<div id="portrait">横向きにしてください</div>
<div id="dbg"><button id="adv">物語を進める</button><button id="rst">最初から</button><button id="demo">見本で埋める</button><button id="adjBtn">調整</button></div>
<div id="adj">
  <div class="tabs"><button data-p="lay" class="on">配置</button><button data-p="snd">効果音</button><button id="adjSide">左右</button><button id="adjClose">閉じる</button></div>
  <div class="pane on" id="p-lay">
    <p>下のボタンか、物を触って選ぶ。ドラッグか矢印で動かす</p>
    <div class="row objs" id="objs"></div>
    <h4 id="selName">（何も選んでいない）</h4>
    <div class="pad"><span></span><button data-d="0,-1">↑</button><span></span><button data-d="-1,0">←</button><button data-d="0,0" id="step">10</button><button data-d="1,0">→</button><span></span><button data-d="0,1">↓</button><span></span></div>
    <label><span>大きさ</span><input type="range" id="sz" min="40" max="2000" step="5"><b id="szv"></b></label>
    <label><span>傾き</span><input type="range" id="rt" min="-60" max="60" step="1"><b id="rtv"></b></label>
    <div class="row"><button id="bkOpen">本：開いた形</button><button id="bkClosed">本：閉じた形</button></div>
    <div class="row"><button id="layReset">配置を元に戻す</button><button id="copyVal">値をコピー</button></div>
  </div>
  <div class="pane" id="p-snd"><p>「選ぶ」で入っている効果音から選べる</p><div id="sndList"></div>
    <div class="row"><button id="sndReset">効果音を元に戻す</button></div></div>
</div>

<script src="../assets/manifest.js?v=1.7.0"></script>
<script src="../assets/picker/asset-picker.js?v=1.7.0"></script>
<script src="../assets/sheet/investigator-sheet.js?v=1.7.0"></script>
<script src="../assets/nakoto/nakoto-desk.js?v=1.7.0"></script>
<script>
(function(){
  'use strict';
  // 試し用の分岐データ
  var chart={chapters:[
    {id:'c1',title:'第1章 卯月の館',nodes:[
      {id:'c1-s1',type:'scene',label:'雨の夜、館の門'},
      {id:'c1-q1',type:'choice',label:'門番の問いかけ',options:[{key:'A',to:'c1-q2'},{key:'B',to:'c1-q2'},{key:'C',to:'c1-e1'}]},
      {id:'c1-e1',type:'end',label:'地下深くの労働者'},
      {id:'c1-q2',type:'choice',label:'書斎の鍵',options:[{key:'A',to:'c1-s2'},{key:'B',to:'c1-e2'}]},
      {id:'c1-e2',type:'end',label:'閉ざされた書斎'},
      {id:'c1-s2',type:'scene',label:'古びた机と一冊の本'},
      {id:'c1-q3',type:'choice',label:'本を開くか',options:[{key:'A',to:'c2-s1'},{key:'B',to:'c1-e3'},{key:'C',to:'c1-e3'}]},
      {id:'c1-e3',type:'end',label:'何も知らずに'}
    ]},
    {id:'c2',title:'第2章 時を渡るもの',nodes:[
      {id:'c2-s1',type:'scene',label:'見知らぬ天井'},
      {id:'c2-q1',type:'choice',label:'円すいの影',options:[{key:'A',to:'c2-s2'},{key:'B',to:'c2-s2'}]},
      {id:'c2-s2',type:'scene',label:'大図書館'},
      {id:'c2-q2',type:'choice',label:'記録を盗み見るか',options:[{key:'A',to:'c2-e1'},{key:'B',to:'c2-e2'},{key:'C',to:'c2-e2'}]},
      {id:'c2-e1',type:'end',label:'交換された精神'},
      {id:'c2-e2',type:'end',label:'帰れぬ旅人'}
    ]},
    {id:'c3',title:'第3章 ？？？',nodes:[{id:'c3-s1',type:'scene',label:'—'}]}
  ]};
  // 「物語を進める」で順に見ていく道すじ（[見た物, 今いる場所]）
  var path=[
    [['c1-s1'],'c1-s1'],
    [['c1-q1','c1-q1:C','c1-e1'],'c1-e1'],
    [['c1-q1:A','c1-q2'],'c1-q2'],
    [['c1-q2:A','c1-s2'],'c1-s2'],
    [['c1-q3'],'c1-q3'],
    [['c1-q3:A','c2-s1'],'c2-s1'],
    [['c2-q1','c2-q1:B','c2-s2'],'c2-s2'],
    [['c2-q2','c2-q2:A','c2-e1'],'c2-e1']
  ];
  var KEY='nakoto-sample-v1';  // 配置・効果音の調整もここに保存
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||null; }catch(_){ return null; } }
  function save(d){ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(_){} }
  // 見本の書き込み：最初に開いたとき、途中まで進んだ状態（セーブ2つ）にしておく
  function demo(){
    var seen=[], shown=[];
    path.forEach(function(p,i){ p[0].forEach(function(id){ seen.push(id); if(i<path.length-2) shown.push(id); }); }); seen.push('c1-q2:B','c1-e2','c1-q3:B','c1-e3'); shown.push('c1-q2:B','c1-e2','c1-q3:B','c1-e3');
    return {step:path.length,state:{seen:seen,shown:shown,opened:false,hasBook:true,hinted:false,saves:[{node:'c1-q2',time:0},{node:'c2-s1',time:0},null]}};
  }
  var data=load()||demo();

  var desk=NakotoDesk.create({
    base:'../assets/nakoto/', assets:'../assets/', chart:chart, state:data.state, layout:data.layout, sounds:data.sounds,
    onLayout:function(l){ data.layout=l; save(data); },
    onSounds:function(m){ data.sounds=m; save(data); }, version:'見本 v1.7.0',
    current: data.step>0?path[data.step-1][1]:null,
    onState:function(s){ data.state=s; save(data); },
    onLoad:function(slot,sv){ alertish('セーブ'+['壱','弐','参'][slot]+'から再開（見本なので表示だけ）'); },
    onClose:function(){ alertish('ゲームに戻る（見本なので机のまま）'); }
  });
  function alertish(t){ var d=document.createElement('div'); d.textContent=t; d.style.cssText='position:fixed;z-index:170;left:50%;top:40%;transform:translateX(-50%);padding:12px 22px;background:rgba(10,8,6,.9);border:1px solid #6a5434;border-radius:4px;font-size:15px;letter-spacing:.1em'; document.body.appendChild(d); setTimeout(function(){ d.remove(); },1800); }
  function advance(){
    if(data.step>=path.length){ alertish('この見本はここまで'); return; }
    var p=path[data.step]; desk.markSeen(p[0]); desk.setCurrent(p[1]); data.step++; data.state=desk.getState(); save(data);
    alertish('物語が進んだ（'+data.step+'/'+path.length+'）');
  }
  if(data.step===0){ advance(); }
  document.getElementById('demo').addEventListener('click',function(){ var d=demo(); d.layout=data.layout; d.sounds=data.sounds; save(d); location.reload(); });
  document.getElementById('adv').addEventListener('click',advance);
  document.getElementById('rst').addEventListener('click',function(){ try{ var keep={step:0,state:null,layout:data.layout,sounds:data.sounds}; localStorage.setItem(KEY,JSON.stringify(keep)); }catch(_){} location.reload(); });

  /* ---- 調整パネル ---- */
  var $=function(id){ return document.getElementById(id); };
  var adj=$('adj'), sel=null;
  var objBox=$('objs');
  Object.keys(NakotoDesk.OBJ_LABELS).forEach(function(k){ var b=document.createElement('button'); b.textContent=NakotoDesk.OBJ_LABELS[k]; b.dataset.k=k; b.onclick=function(){ desk.selectObj(k); peekPanel(); }; objBox.appendChild(b); });
  var stepV=10, peekT=0;
  function peekPanel(){ adj.classList.add('peek'); clearTimeout(peekT); peekT=setTimeout(function(){ adj.classList.remove('peek'); },1600); }
  $('step').onclick=function(e){ e.stopPropagation(); stepV=stepV===10?2:stepV===2?40:10; this.textContent=stepV; };
  adj.querySelectorAll('.pad button[data-d]').forEach(function(b){ if(b.id==='step') return; b.onclick=function(){ if(!sel) return; peekPanel(); var d=b.dataset.d.split(',').map(Number), v=desk.getLayout()[sel]; desk.setObj(sel,{x:v.x+d[0]*stepV,y:v.y+d[1]*stepV}); }; });
  $('adjSide').onclick=function(){ adj.classList.toggle('left'); };
  function onSel(k,v){ sel=k; objBox.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on',b.dataset.k===k); }); $('selName').textContent=k?NakotoDesk.OBJ_LABELS[k]:'（何も選んでいない）';
    if(v){ $('sz').value=v.w; $('szv').textContent=v.w; $('rt').value=v.r||0; $('rtv').textContent=(v.r||0)+'°'; } }
  $('adjBtn').onclick=function(){ var on=!adj.classList.contains('on'); adj.classList.toggle('on',on); desk.setEdit(on,onSel); if(on) renderSnd(); else desk.previewBook(null); };
  $('adjClose').onclick=function(){ adj.classList.remove('on'); desk.setEdit(false); desk.previewBook(null); };
  adj.querySelectorAll('.tabs button[data-p]').forEach(function(b){ b.onclick=function(){ adj.querySelectorAll('.tabs button[data-p]').forEach(function(x){ x.classList.toggle('on',x===b); }); adj.querySelectorAll('.pane').forEach(function(p){ p.classList.toggle('on',p.id==='p-'+b.dataset.p); }); }; });
  $('sz').oninput=function(){ if(!sel) return; desk.setObj(sel,{w:+this.value}); $('szv').textContent=this.value; };
  $('rt').oninput=function(){ if(!sel) return; desk.setObj(sel,{r:+this.value}); $('rtv').textContent=this.value+'°'; };
  $('bkOpen').onclick=function(){ desk.previewBook(true); };
  $('bkClosed').onclick=function(){ desk.previewBook(false); };
  $('layReset').onclick=function(){ desk.resetLayout(); };
  $('copyVal').onclick=function(){ var t=JSON.stringify({layout:desk.getLayout(),sounds:desk.getSounds()}); try{ navigator.clipboard.writeText(t).then(function(){ alertish('コピーしました'); },function(){ prompt('この文字をコピー',t); }); }catch(_){ prompt('この文字をコピー',t); } };
  function shortName(p){ return p?p.replace(/^.*\//,'').replace(/\.mp3$/,''):'（音なし）'; }
  function renderSnd(){
    var box=$('sndList'), cur=desk.getSounds(); box.innerHTML='';
    Object.keys(NakotoDesk.SOUND_LABELS).forEach(function(k){
      var r=document.createElement('div'); r.className='snd';
      r.innerHTML='<div class="t">'+NakotoDesk.SOUND_LABELS[k]+'<small>'+shortName(cur[k])+'</small></div>';
      var pb=document.createElement('button'); pb.textContent='▶'; pb.onclick=function(){ desk.playSound(k); };
      var cb=document.createElement('button'); cb.textContent='選ぶ'; cb.onclick=function(){
        AssetPicker.open({kind:'sound',assets:'../assets/',title:'「'+NakotoDesk.SOUND_LABELS[k]+'」の音',current:desk.getSounds()[k],allowNone:true,
          onPick:function(p){ desk.setSound(k,p); renderSnd(); }}); };
      r.appendChild(pb); r.appendChild(cb); box.appendChild(r);
    });
  }
  $('sndReset').onclick=function(){ Object.keys(NakotoDesk.SOUNDS).forEach(function(k){ desk.setSound(k,NakotoDesk.SOUNDS[k]); }); renderSnd(); };

  var start=document.getElementById('start');
  async function goFull(){
    var el=document.documentElement;
    try{ if(!document.fullscreenElement){ if(el.requestFullscreen) await el.requestFullscreen(); else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen(); } }catch(_){}
    try{ if(screen.orientation&&screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(_){}
    start.classList.add('hide'); desk.show();
  }
  start.addEventListener('click',goFull);
})();
</script>
</body>
</html>
