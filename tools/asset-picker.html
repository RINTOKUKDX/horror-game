<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>素材えらび v1.0.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100vw;height:100dvh;overflow:hidden;background:#050403;color:#e8e2da;font-family:'Shippori Mincho','Noto Serif JP',serif}
  #start{position:fixed;inset:0;z-index:2000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer}
  #start b{font-size:20px;letter-spacing:.3em}#start span{font-size:13px;color:#9a8f80;letter-spacing:.15em}
  #start.hide{display:none}
  #home{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  #home h1{font-size:22px;letter-spacing:.3em;font-weight:600;color:#e9d6ac}
  #home .row{display:flex;gap:12px}
  #home button{min-width:140px;min-height:56px;font-family:inherit;font-size:17px;letter-spacing:.2em;color:#e8dcc4;background:#1e160d;border:1px solid #6a5434;border-radius:5px}
  #home p{font-size:12px;color:#8a7a60;letter-spacing:.1em;text-align:center;line-height:1.8}
  #portrait{position:fixed;inset:0;z-index:3000;background:#000;display:none;align-items:center;justify-content:center;font-size:16px;letter-spacing:.2em}
  @media (orientation:portrait){#portrait{display:flex}}
</style>
</head>
<body>
<div id="start"><b>タップして始める</b><span>全画面・横向きになります</span><span>素材えらび v1.0.0</span></div>
<div id="portrait">横向きにしてください</div>
<div id="home">
  <h1>素材えらび</h1>
  <div class="row"><button data-k="sound">効果音</button><button data-k="bg">背景</button><button data-k="bgm">BGM</button></div>
  <p>★お気に入り・最近使った物・分類の手直しは、この端末に保存されます<br>分類名を押すと、その素材の分類を変えられます</p>
</div>
<script src="../assets/manifest.js"></script>
<script src="../assets/picker/asset-picker.js"></script>
<script>
  document.querySelectorAll('#home button').forEach(function(b){
    b.onclick=function(){ AssetPicker.open({kind:b.dataset.k, assets:'../assets/'}); };
  });
  var start=document.getElementById('start');
  start.addEventListener('click',async function(){
    var el=document.documentElement;
    try{ if(!document.fullscreenElement){ if(el.requestFullscreen) await el.requestFullscreen(); else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen(); } }catch(_){}
    try{ if(screen.orientation&&screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(_){}
    start.classList.add('hide');
  });
</script>
</body>
</html>
